        Behavior: A turn loops over model sampling; a requested function call is executed and its result is sent in a subsequent sample, while an assistant answer completes the turn.
      - Name: run_turn
        RequiredRange: 454-565
        Behavior: The loop selects a step, prepares model input, invokes run_sampling_request, and branches on its result.
      - Name: run_sampling_request
        RequiredRange: 1730-1870
        Behavior: Runs one model sampling request with a turn-scoped client session and cancellation input.

