Capabilities:
  - CapabilityId: AgentTurnOrchestration
    UpstreamSubsystem: CoreTurnLoop
    PublicBehavior: Sample the model, authorize a returned registered in-process read-only action through Core, return a correlated CoreActionReceipt to the next sample, and finish after a final assistant message. External effects require a separate OperationRecord and ChannelReceipt-backed path.
    UserVisibleCapability: A message can produce a reply after a bounded Core-authorized read-only action; an action result never claims an external write or channel receipt.
    Decision: Keep
    SourceRefs: [TurnLoop]
    TargetModules: [AgentRuntime]
    ContractRefs:
      - Architecture/Contracts/CoreAgentContract.md
      - Architecture/Contracts/AsyncAgentRuntimeContractV2.md
      - Architecture/Contracts/AsyncBusinessActionContract.md
      - Architecture/Contracts/ModelProviderContract.md
    ContractStatus: Draft
    ImplementationTask:
      ProposedTaskId: ED-0150
      CandidateWorkstream: AsyncAuthorizedBusinessActionRoundTrip
      TaskRegistration: ProposedPendingFixedHeadReview
      PriorTaskId: ED-0101
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Agent/AsyncRuntimeVerticalSlice/Agent.AsyncRuntimeVerticalSlice
        State: Planned
        Proves: A trusted mock message can produce a bounded Core-authorized EffectClass::InProcessReadOnly action, return its correlated CoreActionReceipt to a later async provider request, and finish through one MockChannel receipt; CoreActionReceipt does not claim ChannelReceipt/OperationRecord success, and shell, arbitrary files and generic MCP tools remain unavailable.

  - CapabilityId: InstructionAssemblyAndPolicyPrecedence
    UpstreamSubsystem: SessionInstructionAndPromptContext
    PublicBehavior: Assemble base and developer instructions separately from user conversation history and model-selected turn context.
    UserVisibleCapability: Stable chat rules and identity disclosure remain higher priority than a message or remembered context.
    Decision: Redesign
    SourceRefs: [InstructionAssembly, TurnLoop]
    TargetModules: [Core, AgentRuntime, ContextSelector]
    ContractRefs:
      - Architecture/Contracts/CoreAgentContract.md
      - Architecture/Contracts/MemoryContract.md
    ContractStatus: Draft
    ImplementationTask:
      ProposedTaskId: ED-0115
      CandidateWorkstream: TrustedInstructionAndPolicyPrecedence
      TaskRegistration: RegisteredAndFrozenPendingP1ExitGate
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Agent/InstructionAndPolicyPrecedence
        State: Planned
        Proves: System/developer rules precede current chat context, summaries cannot override current authorization, and prompt text cannot grant or broaden an action allowlist.

  - CapabilityId: SessionAndConversationState
    UpstreamSubsystem: SessionState
    PublicBehavior: Bind a conversation thread to mutable session state, one active turn, settings, and ordered input.
    UserVisibleCapability: Continue the correct conversation with stable turn identity and bounded history.
    Decision: Redesign
    SourceRefs: [SessionState, TurnState]
    TargetModules: [Core, AgentRuntime, Storage]
    ContractRefs:
      - Architecture/Contracts/CoreAgentContract.md
      - Architecture/Contracts/MemoryContract.md
    ContractStatus: Draft
    ImplementationTask:
      ProposedTaskId: ED-0102
      CandidateWorkstream: CoreConversationAndTurnState
      TaskRegistration: RegisteredAndFrozenPendingP1ExitGate
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Core/ConversationScopeAndTurnState
        State: Planned
        Proves: Turn IDs, trusted conversation scope, terminal state, and persisted state stay associated with one exact channel/account/conversation.

  - CapabilityId: ContextSelectionAndBudget
    UpstreamSubsystem: ContextConstructionAndCompaction
    PublicBehavior: Build bounded model input from system instructions, current input, history, and compaction when the context window is reached.
    UserVisibleCapability: Preserve the current request and useful conversational context without exceeding configured budgets or crossing scopes.
    Decision: Redesign
    SourceRefs: [TurnLoop, ContextCompaction]
    TargetModules: [ContextSelector, Memory, AgentRuntime]
    ContractRefs:
      - Architecture/Contracts/MemoryContract.md
      - Architecture/Contracts/ModelProviderContract.md
    ContractStatus: Draft
    ImplementationTask:
      ProposedTaskId: ED-0103
      CandidateWorkstream: ScopedContextSelection
      TaskRegistration: RegisteredAndFrozenPendingP1ExitGate
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Context/ContextScopePriorityAndBudget
        State: Planned
        Proves: System rules and current trusted message survive truncation; only permitted ConversationScope and explicitly linked memory enter the bounded request.

  - CapabilityId: OpenAIResponsesTransport
    UpstreamSubsystem: ModelProviderResponses
    PublicBehavior: Send Responses requests and consume Responses HTTP/SSE or supported WebSocket streams through a turn-scoped provider client.
    UserVisibleCapability: Use OpenAI Responses with streaming, cancellation, errors, usage, and output limits.
    Decision: Keep
    SourceRefs: [ProviderBoundary]
    TargetModules: [ProviderOpenAIResponses]
    ContractRefs:
