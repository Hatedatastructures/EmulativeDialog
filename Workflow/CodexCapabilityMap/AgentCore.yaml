  - CapabilityId: ToolCallRoundTrip
    UpstreamSubsystem: ToolRoutingAndExecution
    PublicBehavior: Treat a model function call as a request, route it to a registered handler, produce an output item, and continue the turn with that result.
    UserVisibleCapability: Execute only explicitly registered business actions and explain success, rejection, unsupported capability, or failure.
    Decision: Redesign
