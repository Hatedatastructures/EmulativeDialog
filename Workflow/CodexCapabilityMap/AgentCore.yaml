      CandidateWorkstream: ProviderErrorsAndSafeRetry
      TaskRegistration: RegisteredAndFrozenPendingP1ExitGate
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Providers/CanonicalErrorAndRetryPolicy
        State: Planned
        Proves: Timeout, disconnect, malformed stream, auth failure, output limit, cancellation, and exhausted retry have stable error codes; unsafe side effects are never blindly retried.

  - CapabilityId: InterruptedTurnRecoveryAndUnknownOutcome
    UpstreamSubsystem: TurnRecoveryAndPersistence
    PublicBehavior: Capture an eligible interrupted turn only after its input has been recorded, then restore enough turn attribution to resume safely.
    UserVisibleCapability: Restart recovery preserves conversation scope and does not resend an action whose external result is unknown.
    Decision: Redesign
    SourceRefs: [InterruptedTurnRecovery, SessionState, TurnState]
    TargetModules: [Core, AgentRuntime, Storage]
    ContractRefs:
      - Architecture/Contracts/CoreAgentContract.md
      - Architecture/Contracts/MemoryContract.md
    ContractStatus: Draft
    ImplementationTask:
      ProposedTaskId: ED-0112
      CandidateWorkstream: RecoverableTurnAndOperationOutcome
      TaskRegistration: Revision5ProposedAwaitingFixedHeadReview
    ImplementationProgress:
      State: PartialUnmergedCheckpoint
      CurrentTaskRevision: ED-0112/R5-Proposed
      ProvesWhenAccepted: "Scoped checkpoint persistence and deterministic recovery decisions, including fail-closed handling of unknown side effects."
      DoesNotProve: "Conversation message/session rehydration, a production Core startup call site, or resumption through AgentRuntime."
      CompletionRule: "Keep this capability incomplete until a separately reviewed implementation task connects rehydrated scoped context to Core/AgentRuntime and proves safe resumption without replaying UnknownOutcome."
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Core/UnknownOutcomeRecovery
        State: Planned
        Proves: Recovery distinguishes not-sent, completed, failed, and unknown action outcomes; unknown is never resent automatically and can be reconciled by a durable OperationRecord.

