        State: Planned
        Proves: The model cannot dispatch an unregistered action; Core validates schema/scope/policy and a mock receipt is required before success is reported.

  - CapabilityId: TrustedIdentityAndActionPolicy
    UpstreamSubsystem: ToolPolicyAdaptation
    PublicBehavior: Adapt upstream per-turn tool policy and routed-call checks to trusted channel identity and Core-owned authorization.
    UserVisibleCapability: Model-supplied identity, account, conversation, role, or permission fields never grant authority.
    Decision: Redesign
    SourceRefs: [ToolInventory, ResponseItemsAndTools]
    ProductRefs:
      - Architecture/Contracts/CoreAgentContract.md
    TargetModules: [Core]
    ContractRefs:
      - Architecture/Contracts/CoreAgentContract.md
    ContractStatus: Draft
    UpstreamGap: >-
      Codex tool policy is workspace/tool oriented. Trusted QQ account and sender identity mapping
      are product-specific and must be implemented in C++ Core; no model prompt is an authorization boundary.
    ImplementationTask:
      ProposedTaskId: ED-0109
      CandidateWorkstream: CoreTrustedIdentityAndPolicy
      TaskRegistration: RegisteredAndFrozenPendingP1ExitGate
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Core/TrustedEnvelopeAuthorization
        State: Planned
        Proves: A spoofed model identity is ignored, cross-conversation actions are rejected, and every action is re-authorized against the current trusted envelope and policy.

  - CapabilityId: TurnAndProviderCancellation
    UpstreamSubsystem: TurnAndRequestCancellation
