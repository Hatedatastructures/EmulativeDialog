    ImplementationTask:
      ProposedTaskId: ED-0106
      CandidateWorkstream: AnthropicMessagesProvider
      TaskRegistration: RegisteredAndFrozenPendingP1ExitGate
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Providers/AnthropicMessages/RequestAndEventMapping
        State: Planned
        Proves: Anthropic system/messages/tool_use/tool_result/SSE block/stop reason/usage fixtures map to canonical semantics and unsupported fields fail explicitly.

  - CapabilityId: CanonicalStreamedAgentEvents
    UpstreamSubsystem: ResponseStreamAndItems
    PublicBehavior: Convert provider response items and deltas into ordered user-visible turn items, persist completed items, and emit tool-call lifecycle events.
    UserVisibleCapability: Stream reply text and action status without duplicating or omitting the final event.
