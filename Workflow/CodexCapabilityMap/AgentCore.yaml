    Rationale: Explicit hard product exclusion; only named business actions reviewed and authorized by Core may be invoked.
    ProductRefs:
      - Goals/ProductGoals.md
      - Architecture/Decisions/Adr0002CodexAgentCppRewrite.md

  - CapabilityId: HostEnvironmentAndStateInspection
    UpstreamSubsystem: WorkspaceEnvironment
    PublicBehavior: Capture OS/executor/workspace/shell environment details and include them in turn configuration or tool planning.
    UserVisibleCapability: No host status query, environment inspection, or workspace state is exposed to the chat model.
    Decision: Remove
    SourceRefs: [CommandAndWorkspaceTools]
    TargetModules: []
    Rationale: Explicitly excluded from the chat Agent; product context comes only from trusted message scopes and approved memory.
    ProductRefs:
      - Goals/ProductGoals.md
      - Architecture/Decisions/Adr0002CodexAgentCppRewrite.md

  - CapabilityId: ArbitraryFilesystemAccess
    UpstreamSubsystem: WorkspaceFilesystemTools
    PublicBehavior: Use environment-bound file systems and patch tools to inspect or modify arbitrary workspace paths.
    UserVisibleCapability: The model cannot read or modify arbitrary local files.
    Decision: Remove
    SourceRefs: [CommandAndWorkspaceTools, ToolInventory]
    TargetModules: []
    Rationale: Explicit product exclusion; a future business action must be narrowly registered and Core-authorized rather than exposing a filesystem surface.
    ProductRefs:
      - Goals/ProductGoals.md
      - Architecture/Decisions/Adr0002CodexAgentCppRewrite.md#明确排除

  - CapabilityId: GenericMcpPluginsSkillsAndDeveloperTools
    UpstreamSubsystem: ExtensibleDeveloperTooling
    PublicBehavior: Discover or dispatch generic MCP tools, plugins, skills, and extension-provided developer actions.
    UserVisibleCapability: No generic MCP, plugin, skill, or developer-tool marketplace is available to chat turns.
    Decision: Remove
    SourceRefs: [ToolInventory, ResponseItemsAndTools, PluginsAndSkills]
    TargetModules: []
    Rationale: Product only allows named business actions with explicit Core authorization; arbitrary extension discovery is outside the chat tool surface.
    ProductRefs:
      - Goals/ProductGoals.md
      - Architecture/Decisions/Adr0002CodexAgentCppRewrite.md#明确排除

  - CapabilityId: ArbitraryNetworkAndWebTools
    UpstreamSubsystem: NetworkAndHostedTools
    PublicBehavior: Expose broad network, web search, hosted, or external connector tools to model turns.
    UserVisibleCapability: There is no arbitrary network or generic web tool; provider HTTPS is a separately configured provider transport.
    Decision: Remove
    SourceRefs: [ToolInventory, HostedWebSearch]
    TargetModules: []
    Rationale: A provider's fixed HTTPS endpoint is not a general-purpose Agent network tool; only Core-reviewed business actions may cause external effects.
    ProductRefs:
      - Goals/ProductGoals.md
      - Architecture/Contracts/ModelProviderContract.md#安全与可靠性

  - CapabilityId: MultiAgentDelegation
    UpstreamSubsystem: SubagentOrchestration
    PublicBehavior: Spawn and manage child agents from a model turn.
    UserVisibleCapability: Not included in the current chat Agent scope; revisit only if a product decision defines a user-authorized chat delegation scenario.
    Decision: Defer
    SourceRefs: [ToolInventory]
    TargetModules: []
    Rationale: ADR-0002 does not authorize generic developer-agent delegation and the first product slice has no child-agent action contract.
    RevisitGate: New approved product task and ChangeRequest if behavior crosses current exclusions.

  - CapabilityId: RealtimeVoiceAndAudioSession
    UpstreamSubsystem: RealtimeMedia
    PublicBehavior: Start real-time media calls and retain realtime conversation state.
    UserVisibleCapability: Not part of the current text-message chat scope; QQ media/audio input remains subject to the separate channel qualification gate.
    Decision: Defer
    SourceRefs: [RealtimeAudio]
    TargetModules: []
    Rationale: No current product or channel contract authorizes a realtime voice session.
    RevisitGate: A future product/channel decision; this mapping does not investigate WeChat or promise QQ voice support.

