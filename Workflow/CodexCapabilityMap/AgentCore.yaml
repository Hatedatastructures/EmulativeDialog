    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Agent/CancellationLifecycle
        State: Planned
        Proves: Cancellation propagates through provider and action execution, emits one cancelled or unknown terminal state, and never emits a false successful receipt.

  - CapabilityId: ProviderFailureAndRetrySemantics
    UpstreamSubsystem: ResponsesRetryAndErrors
    PublicBehavior: Classify stream failures, apply bounded retries to safe model requests, and surface terminal errors.
    UserVisibleCapability: Failures are stable, sanitized, and never confused with normal completion.
    Decision: Redesign
    SourceRefs: [RetryAndFailure, ProviderBoundary]
    TargetModules: [AgentRuntime, ProviderOpenAIResponses, ProviderOpenAIChatCompletions, ProviderAnthropicMessages]
    ContractRefs:
      - Architecture/Contracts/CoreAgentContract.md
