        State: Planned
        Proves: Responses request fixture and streamed text/tool/error/usage events map to canonical events with stable item IDs and one terminal event.

  - CapabilityId: OpenAICompatibleChatCompletions
    UpstreamSubsystem: ProviderProtocolExtension
    PublicBehavior: Add the separately required Chat Completions protocol behind the common provider boundary.
    UserVisibleCapability: Configure an OpenAI-compatible Chat Completions provider without leaking wire fields into AgentRuntime.
    Decision: Redesign
    SourceRefs: [ProviderBoundary]
    ProductRefs:
      - Goals/ProductGoals.md
      - Architecture/Contracts/ModelProviderContract.md#三协议映射
    TargetModules: [ProviderOpenAIChatCompletions]
    ContractRefs:
      - Architecture/Contracts/ModelProviderContract.md
    ContractStatus: Draft
    UpstreamGap: >-
      The pinned upstream WireApi has only Responses and rejects wire_api=chat. This adapter is a
      product-required protocol extension, not a claim that the pinned Codex source implements it.
    ImplementationTask:
      ProposedTaskId: ED-0105
      CandidateWorkstream: OpenAIChatCompletionsProvider
      TaskRegistration: RegisteredAndFrozenPendingP1ExitGate
    AcceptanceEvidencePlan:
      - Artifact: Tests/Contract/Providers/OpenAIChatCompletions/RequestAndEventMapping
        State: Planned
        Proves: Chat messages, stream chunks, tool-call assembly, finish reason, usage, error, and cancellation map to canonical request/event semantics; unsupported vendor fields fail explicitly.

  - CapabilityId: AnthropicMessagesProtocol
    UpstreamSubsystem: ProviderProtocolExtension
    PublicBehavior: Add the separately required Anthropic Messages protocol behind the common provider boundary.
    UserVisibleCapability: Configure Anthropic Messages while preserving tool_use/tool_result, stop reason, usage, and protocol-specific errors.
    Decision: Redesign
    SourceRefs: [ProviderBoundary]
