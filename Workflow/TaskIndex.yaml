# 常驻任务索引：只读此文件的路由与队列字段，不把全部计划和历史读入上下文。
SchemaVersion: 2
ProjectId: EmulativeDialog
CurrentReleaseId: Bootstrap
CurrentStatePath: Workflow/CurrentState.md
ModuleMapPath: Architecture/ModuleMap.yaml
ExecutionStandardPath: Workflow/AgentExecutionStandard.md
LifecyclePath: Workflow/TaskLifecycle.md
TaskRecordTemplatePath: Workflow/TaskTemplate.yaml
AgentPoolPath: Workflow/AgentPool.yaml
PlanRoot: Workflow/Plans
EventStore:
  Format: JSONL
  Root: Workflow/Events
  ShardBy:
    - ReleaseId
    - PhaseId
  CreateOnFirstUse: true
CommunicationStore:
  Format: JSONL
  Root: Workflow/Communications
  ShardBy:
    - ReleaseId
    - PhaseId
  LoadOnlyOpenMessagesForCurrentTask: true
TaskArchive:
  Format: StructuredRecords
  Root: Workflow/Archive
  LoadOnlyByTaskId: true

Coordination:
  # Worker01/Worker06 为支持槽；Worker02-Worker05 为实现槽。
  MaximumSubagents: 6
  MaximumRemoteBranches: 4
  ReservedIntegrationBranches: 1
  MaximumConcurrentTaskBranches: 3
  EffectiveParallelism: MinimumOfConfiguredSlotsHostCapacityReadyIndependentTasksAndRemoteBranchCapacity
  CoordinatorIsSeparate: true
  StableRoleSlots: true
  ReuseAgentSessionAcrossRelatedTasks: true
  DoNotCloseAgentAfterEverySmallTask: true
  FillSlotsOnlyWithReadyIndependentTasks: true
  RequireIndependentWorktrees: true
  IntegrationBranchSingleWriter: true

LoadPolicy:
  AlwaysLoad:
    - AGENTS.md
    - Workflow/CurrentState.md
    - Workflow/TaskIndex.yaml
  ThenLoad:
    - OneTaskRecordByTaskId
    - OneModuleEntryByModuleId
    - ReferencedContractsAndDecisionsOnly
  NeverAutoLoad:
    - AllTaskRecords
    - AllPhasePlans
    - ClosedCommunicationMessages
    - HistoricalEventArchives
    - FullSourceTree
  GovernanceByRole:
    Coordinator:
      - Workflow/AgentExecutionStandard.md
      - Workflow/TaskLifecycle.md
      - Workflow/EnforcementMatrix.yaml
      - Workflow/AgentPool.yaml
    Implementer:
      - RelevantSectionsOfWorkflow/AgentExecutionStandard.md
      - CurrentTaskRecord
      - CurrentModuleShard
    Reviewer:
      - RelevantSectionsOfWorkflow/TaskLifecycle.md
      - CurrentTaskRecord
      - CurrentPullRequestDiff

ExecutionGates:
  CodexCorePreparation:
    RequiredTaskIds:
      - ED-0001
      - ED-0005
    Unlocks:
      - P1
    State: Passed
    EvidenceRefs:
      - Workflow/Plans/P0.yaml#ED-0001
      - Workflow/Plans/P0.yaml#ED-0005
      - Workflow/Events/Bootstrap/P0.jsonl
  ProductAgentImplementation:
    RequiredP1Gate: AgentWorkflowControllerAndCoreContractsVerified
    RequiredTaskIds:
      - ED-0006
      - ED-0007
      - ED-0008
    Unlocks:
      - P2
      - P3
    RequiredRegisteredTaskSpecs:
      - ED-0101
      - ED-0102
      - ED-0103
      - ED-0104
      - ED-0105
      - ED-0106
      - ED-0107
      - ED-0108
      - ED-0109
      - ED-0110
      - ED-0111
      - ED-0112
      - ED-0113
      - ED-0114
      - ED-0115
    State: Passed
    StateScope: P1GateAndTaskSpecRegistration
    CoordinatorSignoffEventId: a4de8064-e080-4331-9981-ac62b1ee6c6c
    EvidenceManifestSHA256: 770f3b3d0913e49cf70a2aff16b6afa44c1e7754dab179d5d201cba5c0205ecc
    ProductCodeScope: FirstVerticalSliceOnly
    ProductImplementationCodeReady: ReadyAfterED0124R9
  LargeScaleProductImplementation:
    State: Passed
    CoordinatorSignoffEventId: de3d6255-0beb-4ef9-a373-f9a7526688f2
    RequiredConditions: [FormalPullRequest, IndependentReviewer, RequiredChecks, ProtectedIntegrationBranch]
    EvidenceRefs:
      - https://github.com/Hatedatastructures/EmulativeDialog/pull/79
      - H:/Qbot/EmulativeDialog.integration-port-contract.build/Reviews/ED-0154-WindowsRequiredChecks/Worker06-FixedHeadReview-PR79-ec93d070-20261030.md
      - H:/Qbot/EmulativeDialog.integration-port-contract.build/ED-0154-WindowsRequiredChecks/Logs/GitHubRun-41038850833.log
      - H:/Qbot/EmulativeDialog.integration-port-contract.build/ED-0154-WindowsRequiredChecks/Logs/GitHubRun-41038842056.log
      - H:/Qbot/EmulativeDialog.integration-port-contract.build/ED-0154-WindowsRequiredChecks/Logs/BranchProtectionVerification.json
  QQChannelImplementation:
