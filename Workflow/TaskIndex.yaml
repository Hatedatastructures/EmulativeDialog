PhasePlans:
  - PhaseId: P0
    Path: Workflow/Plans/P0.yaml
    State: Current
    LoadWhen: ScopeAndEvidenceWorkIsAssigned
  - PhaseId: P1
    Path: Workflow/Plans/P1.yaml
    State: Current
    LoadWhen: CodexCorePreparationGatePassed
  - PhaseId: P2
    Path: Workflow/Plans/P2.yaml
    State: Current
    LoadWhen: AgentWorkflowControllerAndCoreContractsVerified
  - PhaseId: P3
    Path: Workflow/Plans/P3.yaml
    State: Current
    LoadWhen: AgentWorkflowControllerAndCoreContractsVerifiedAndFirstAgentRuntimeSliceVerifiedAndP3EntryGatePassed
  - PhaseId: P4
    Path: ""
    State: NotExpanded
    LoadWhen: AgentWorkflowControllerOperationalAndQQChannelGatePassed
  - PhaseId: P5
    Path: ""
    State: NotExpanded
    LoadWhen: AgentWorkflowControllerOperationalAndTuiReferenceAndParityScopeFrozen
  - PhaseId: P6
    Path: ""
    State: NotExpanded
    LoadWhen: AllCurrentReleaseGatesPassed
