    ProposedGoal: >-
      Correct the cross-document status and disclosure conflict among ADR-0003,
      HttpTransportContract V1, and CoreEndpointGrantContract V1. Treat
      EndpointGrantId as a bearer capability that is never logged; use the
      local TransportRequestId for transport diagnostic/event correlation.
      Preserve the existing API and transport semantics, and keep the P3
      EntryGate Pending until a separate independent gate closeout.
    Scope: >-
      Create ED-0120/R3 as a documentation and contract-status correction.
      Keep the ADR decision Accepted and its Windows TLS, proxy, redirect,
      timeout, cancellation, and unknown-outcome decisions unchanged. Replace
      the ADR clause that permits logging an endpoint grant ID with the
      uniform no-disclosure rule. State consistently in HttpTransportContract
      V1 and CoreEndpointGrantContract V1 that EndpointGrantId is an opaque
      bearer capability and must not appear in logs, events, telemetry,
      diagnostics, persisted records, command output, or user-visible output;
      use TransportRequestId only for transport-level request correlation.
      Set each contract status only when its exact independent review and
      merge evidence supports that status. Do not change C++ API, wire
      behavior, security decisions, contract version, implementation, or tests.
      Do not edit the P3 plan or P3 event shard.
    Reason: >-
      ADR-0003 currently permits diagnostic logging of an endpoint grant ID,
      while CoreEndpointGrantContract V1 prohibits logging grant IDs because
      they are bearer capabilities. HttpTransportContract V1 already defines
      TransportRequestId as a local diagnostic/event correlation ID and says
      sensitive values must not enter terminal results, events, or logs.
      The same P2 task record still marks HttpTransportContract V1 as
      PendingCorrectiveRevision, while the contract itself says freeze
      candidate. R3 aligns these records without changing behavior. The
      P3 EntryGate remains independently controlled and must not be inferred
      from this documentation correction.
    R2Disposition: MergedHistoryPreserved
    ProposedWriteSetChangeReason: >-
      R2 compiled Port and contract-test work remain merged and immutable. R3
      limits product writes to the three documentation paths needed to remove
      the grant-ID disclosure contradiction and correct status labels; it adds
      no C++ implementation or test write permission.
