      CoverageCommand: |-
        $ErrorActionPreference = 'Stop'
        $Worktree = 'H:/Qbot/EmulativeDialog.ED-0146'
        $Build = 'H:/Qbot/EmulativeDialog.integration-port-contract.build/ED-0146-R6/Network'
        $ReportRoot = 'H:/Qbot/EmulativeDialog.integration-port-contract.build/ED-0146-R6/Reports'
        $Gxx = 'C:/msys64/ucrt64/bin/g++.exe'
        $Gcov = 'C:/msys64/ucrt64/bin/gcov.exe'
        $ExpectedVersion = '16.1.0'
        $WarningPattern = '(?im)(?:libgcov|profiling)[^\r\n]*(?:checksum|overwrit\w*)|(?:checksum|overwrit\w*)[^\r\n]*(?:libgcov|profiling)'

        function Normalize-CoveragePath([string]$Path, [string]$BaseDirectory) {
          $Value = $Path.Replace('/', '\')
          if (-not [System.IO.Path]::IsPathRooted($Value)) { $Value = Join-Path $BaseDirectory $Value }
          return [System.IO.Path]::GetFullPath($Value).TrimEnd('\').ToLowerInvariant()
        }

        function Read-CoverageJson([string]$Path) {
          $InputStream = [System.IO.File]::OpenRead($Path)
          try {
            $ZipStream = [System.IO.Compression.GzipStream]::new($InputStream, [System.IO.Compression.CompressionMode]::Decompress)
            try {
              $Reader = [System.IO.StreamReader]::new($ZipStream)
              try { $JsonText = $Reader.ReadToEnd() } finally { $Reader.Dispose() }
            } finally { $ZipStream.Dispose() }
          } finally { $InputStream.Dispose() }
          return (ConvertFrom-Json -InputObject $JsonText -ErrorAction Stop)
        }

        function Measure-Coverage([string]$Label, [string]$GcnoName, [string]$ExpectedTranslationUnit, [string]$CoverageSourcePath, [string]$TestName, [string]$RunDirectory) {
          $Notes = @(Get-ChildItem -LiteralPath $Build -Recurse -File -Filter $GcnoName)
          if ($Notes.Count -ne 1) { throw "Expected one $GcnoName; found $($Notes.Count)" }
          $DataPath = [System.IO.Path]::ChangeExtension($Notes[0].FullName, '.gcda')
          foreach ($RequiredPath in @($DataPath)) {
            if (-not (Test-Path -LiteralPath $RequiredPath -PathType Leaf)) { throw "Missing gcov input: $RequiredPath" }
          }
          if ((Get-Item -LiteralPath $DataPath).LastWriteTimeUtc -lt (Get-Item -LiteralPath $Notes[0].FullName).LastWriteTimeUtc) {
            throw "gcda predates its paired gcno for $Label"
          }

          $TestLogPath = Join-Path $Build 'Testing/Temporary/LastTest.log'
          if (-not (Test-Path -LiteralPath $TestLogPath -PathType Leaf)) { throw "Missing CTest log for $Label" }
          $TestLogInfo = Get-Item -LiteralPath $TestLogPath
          $TestLogText = [System.IO.File]::ReadAllText($TestLogPath)
          $LogLines = [System.IO.File]::ReadAllLines($TestLogPath)
          $StartPattern = '^\d+/\d+ Testing: ' + [regex]::Escape($TestName) + '\s*$'
          $StartIndexes = @()
          for ($Index = 0; $Index -lt $LogLines.Count; $Index++) {
            if ($LogLines[$Index] -match $StartPattern) { $StartIndexes += $Index }
          }
          if ($StartIndexes.Count -ne 1) { throw "Expected one LastTest.log block for $TestName; found $($StartIndexes.Count)" }
          $StartIndex = $StartIndexes[0]
          $EndIndex = $LogLines.Count
          for ($Index = $StartIndex + 1; $Index -lt $LogLines.Count; $Index++) {
            if ($LogLines[$Index] -match '^\d+/\d+ Testing: ' -or $LogLines[$Index] -match '^End testing:') {
              $EndIndex = $Index
              break
            }
          }
          $TestBlock = $LogLines[$StartIndex..($EndIndex - 1)] -join [Environment]::NewLine
          $TestEntryPattern = '(?m)^\d+/\d+ Test: ' + [regex]::Escape($TestName) + '\s*$'
          $PassedMarkerPattern = '(?s)Test time\s*=.*?\r?\n-+\r?\nTest Passed\.\r?\n'
          if ($TestBlock -notmatch $TestEntryPattern -or $TestBlock -notmatch $PassedMarkerPattern) {
            throw "CTest log block does not prove $TestName passed"
          }
          if ($TestLogInfo.LastWriteTimeUtc -lt (Get-Item -LiteralPath $DataPath).LastWriteTimeUtc) {
            throw "CTest log predates the coverage data for $Label"
          }
          if ($TestLogText -match $WarningPattern) { throw "CTest log has stale/conflicting gcov data for $Label" }

          New-Item -ItemType Directory -Path $RunDirectory | Out-Null
          Push-Location -LiteralPath $RunDirectory
          try {
            $TranslationUnitPath = Join-Path $Worktree $ExpectedTranslationUnit
            $Output = @(& $Gcov --json-format --branch-counts --preserve-paths -o $Notes[0].FullName $TranslationUnitPath 2>&1)
            $ExitCode = $LASTEXITCODE
          } finally { Pop-Location }
          $OutputText = ($Output | ForEach-Object { [string]$_ }) -join "`n"
          if ($ExitCode -ne 0) { throw "gcov failed for $Label with exit ${ExitCode}: $OutputText" }
          if ($OutputText -match $WarningPattern) { throw "gcov reported stale/conflicting data for ${Label}: $OutputText" }

          $JsonFiles = @(Get-ChildItem -LiteralPath $RunDirectory -File -Filter '*.gcov.json.gz')
          if ($JsonFiles.Count -ne 1) { throw "Expected one gcov JSON for $Label; found $($JsonFiles.Count)" }
          $Json = Read-CoverageJson $JsonFiles[0].FullName
          if ([string]$Json.format_version -ne '2' -or [string]$Json.gcc_version -ne $ExpectedVersion) { throw "Wrong gcov JSON version for $Label" }

          $ExpectedTranslationUnitPath = Normalize-CoveragePath (Join-Path $Worktree $ExpectedTranslationUnit) $Worktree
          $TranslationUnitRecords = @($Json.files | Where-Object { (Normalize-CoveragePath ([string]$_.file) ([string]$Json.current_working_directory)) -eq $ExpectedTranslationUnitPath })
          if ($TranslationUnitRecords.Count -ne 1) { throw "Expected one translation-unit files[].file record for $Label; found $($TranslationUnitRecords.Count)" }
          $ExpectedSourcePath = Normalize-CoveragePath $CoverageSourcePath $Worktree
          $Records = @($Json.files | Where-Object { (Normalize-CoveragePath ([string]$_.file) ([string]$Json.current_working_directory)) -eq $ExpectedSourcePath })
          if ($Records.Count -ne 1) { throw "Expected one source record for $Label; found $($Records.Count)" }

          $LineCoverage = @{}
          foreach ($Line in @($Records[0].lines)) {
            if ($null -eq $Line.line_number -or $null -eq $Line.count) { throw "Missing line fields for $Label" }
            $LineNumber = [int]$Line.line_number
            $Count = [long]$Line.count
            if ($LineNumber -le 0 -or $Count -lt 0) { throw "Invalid line record for $Label" }
            if (-not $LineCoverage.ContainsKey($LineNumber)) { $LineCoverage[$LineNumber] = $false }
            if ($Count -gt 0) { $LineCoverage[$LineNumber] = $true }
          }
          $Total = $LineCoverage.Count
          if ($Total -eq 0) { throw "Empty executable-line denominator for $Label" }
          $Covered = 0
          foreach ($Hit in $LineCoverage.Values) { if ($Hit) { $Covered++ } }
          $Percent = 100.0 * $Covered / $Total
          $PercentText = $Percent.ToString('F2', [System.Globalization.CultureInfo]::InvariantCulture)
          Write-Output "$Label COVERED=$Covered EXECUTABLE=$Total PERCENT=$PercentText JSON=2 GCC=$($Json.gcc_version) REPORT=$($JsonFiles[0].FullName)"
          if (($Covered * 100) -lt ($Total * 80)) { throw "$Label coverage is below 80 percent" }
        }

        try {
          $CompilerVersion = (& $Gxx --version 2>&1 | Out-String)
          $CompilerVersionPattern = "(?<![0-9.])$([regex]::Escape($ExpectedVersion))(?![0-9.])"
          if ($LASTEXITCODE -ne 0 -or $CompilerVersion -notmatch $CompilerVersionPattern) { throw "Expected GCC ${ExpectedVersion}: $CompilerVersion" }
          $GcovVersion = (& $Gcov --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $GcovVersion -notmatch $CompilerVersionPattern -or $GcovVersion -notmatch 'JSON format version:\s*2') { throw "Expected gcov $ExpectedVersion with JSON v2: $GcovVersion" }

          New-Item -ItemType Directory -Force -Path $ReportRoot | Out-Null
          $RunRoot = Join-Path $ReportRoot ('Run-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $RunRoot | Out-Null
          Measure-Coverage 'HttpTransportPort.hpp' 'HttpTransportPortTests.cpp.gcno' 'Tests/Contract/Platform/Network/HttpTransportPortTests.cpp' 'Source/Platform/Network/HttpTransportPort.hpp' 'Platform.Network.HttpTransportPort' (Join-Path $RunRoot 'Port')
          Measure-Coverage 'WinHttpTransport.cpp' 'WinHttpTransport.cpp.gcno' 'Source/Platform/Network/WinHttpTransport.cpp' 'Source/Platform/Network/WinHttpTransport.cpp' 'Platform.Network.WinHttpTransport' (Join-Path $RunRoot 'WinHttp')
          Write-Output "GXX_VERSION=$ExpectedVersion GCOV_VERSION=$ExpectedVersion GCOV_JSON_FORMAT=2 REPORT_ROOT=$RunRoot"
        } catch {
          [Console]::Error.WriteLine($_.Exception.Message)
          exit 1
        }
