SchemaVersion: 1
PhaseId: P2
PhaseName: Core Identity, AgentRuntime, and First Product Slice
State: PendingP1ExitGate

EntryGate:
  RequiredGateId: AgentWorkflowControllerAndCoreContractsVerified
  RequiredState: Passed
  ProductAgentRuntimeCodeAllowed: false
  State: Pending

TaskSpecRegistration:
  CapabilityMapSource: Workflow/CodexCapabilityMap/AgentCore.yaml
  RequiredCapabilityTaskIds:
    - ED-0101
    - ED-0102
    - ED-0103
    - ED-0107
    - ED-0108
    - ED-0109
    - ED-0110
    - ED-0111
    - ED-0112
    - ED-0115
  AdditionalInfrastructureTaskIds: [ED-0120, ED-0124]
  AllTaskSpecsFrozenBeforeAssignment: true

ChangeRequests:
  - ChangeRequestId: CR-ED-0018-002
    TargetTaskId: ED-0018
    TargetTaskRevision: 2
    RequestedBy: Coordinator
    ApprovedBy: Coordinator
    Decision: Accepted
    Scope: >-
      Preserve MockChannel's deterministic, one-shot, receipt-correlation behavior while replacing
      test-only object-address matching with exact ActionId/OperationId matching. This lets Core
      create the action inside the product path and the fixture return only its pre-scripted,
      correlated receipt. No real channel behavior, retry, or authorization rule changes.

ParallelGroups:
  - GroupId: FirstProductSlice
    TaskIds: [ED-0109, ED-0101, ED-0124]
    DependsOn: [ED-0006, ED-0007, ED-0008, ED-0015, ED-0016, ED-0018, ED-0020]
    OrderedDependencies:
      - ED-0109
      - ED-0101
      - ED-0124
  - GroupId: IndependentContractPreparation
    TaskIds: [ED-0120]
    WriteSetsDisjoint: true
    SharedLocksDisjoint: true
  - GroupId: SessionStateFollowup
    TaskIds: [ED-0102]
    DependsOn: [ED-0101]
  - GroupId: ContextSelectionFollowup
    TaskIds: [ED-0103]
    DependsOn: [ED-0101]
  - GroupId: AgentRuntimeFollowups
    TaskIds: [ED-0107, ED-0108, ED-0110, ED-0111, ED-0112, ED-0115]
    DependsOn:
      - ED-0101
      - ED-0109
      - ED-0104
      - ED-0105
      - ED-0106

ExitGate:
  GateId: FirstCppAgentRuntimeVerticalSliceVerified
  RequiredTaskIds: [ED-0109, ED-0101, ED-0124]
  RequiredEvidence:
    - Windows-native C++20 build target compiles Core and AgentRuntime product sources.
    - Root CMake exposes and builds AgentRuntimeVerticalSliceTests, and the focused CTest case passes.
    - Mock ingress passes Core trusted identity and policy checks before AgentRuntime runs.
    - AgentRuntime runs one complete turn through FakeProvider and returns only a completed final answer.
    - Core sends one authorized text action and verifies the correlated MockChannel receipt.
    - Unauthorized identity, duplicate inbound, provider failure, and mismatched receipt do not report success.
    - Changed production Core and AgentRuntime modules each meet at least 80 percent line coverage.
    - Independent fixed-Head review and local ReviewBundle are recorded; GitHub PR attempt is recorded separately.
  Unlocks:
    - P2FollowupTasks
    - P3ProviderAndMemoryTasks
  State: Pending

Tasks:
  - TaskId: ED-0109
    TaskRevision: 1
    EpicId: EP-06
    Title: 实现可信身份映射与 Core 聊天策略入口
    TaskKind: IntegrationTask
    State: Blocked
    Phase: P2
    OwnerRole: CoreOwner
    OwnerSlotId: Worker02
    OwnerAgentId: "/root/agent_core"
    ReviewerRole: MemoryContextOwner
    ReviewerSlotId: Worker06
    ReviewerAgentId: "/root/memory_context"
    ReviewerIndependence: Required
    CreatedBy: Coordinator
    ChangeRequestId: CR-ED-0018-002
    CapabilityIds: [TrustedIdentityAndActionPolicy]
    ModuleIds: [Core, ChannelAdapterPort]
    Goal: >-
      实现 Core 的可信 ChannelEnvelope 身份映射、会话范围和文本动作授权；拒绝由正文或 Provider 输出
      自称的身份/权限；只在 AgentRuntime 返回完整最终文字后创建 CoreAuthorizedAction，并验证唯一回执。
    OutOfScope:
      - Provider wire protocol 或真实网络
      - 持久会话、durable memory 或数据库迁移
      - 真实 QQ 登录、发送或微信
      - 工具执行、Shell、任意文件和通用 MCP
    DependsOn: [ED-0007, ED-0016, ED-0018, ED-0015]
    ContractVersion:
      - Architecture/Contracts/CoreAgentContract.md V1
      - Architecture/Contracts/ChannelAdapterContract.md V1
      - Architecture/Contracts/ModelProviderContract.md V1.1
    Context:
      ModuleId: Core
      ReadSet:
        - AGENTS.md
        - Workflow/CurrentState.md
        - Workflow/TaskIndex.yaml
        - Architecture/ModuleMap.yaml
        - Architecture/Modules/HostCoreAgent.yaml
        - Architecture/Modules/Channels.yaml
        - Architecture/Contracts/CoreAgentContract.md
        - Architecture/Contracts/ChannelAdapterContract.md
        - Architecture/Contracts/ModelProviderContract.md
        - Source/Channels/Contracts/ChannelAdapterPort.h
        - Tests/Contract/Channels/Contracts/MockChannelAdapter.h
        - Tests/Contract/Channels/Contracts/MockChannelContractTests.cpp
      OnDemandSet: []
      ForbiddenSet:
        - Workflow/Plans/P1.yaml
        - Workflow/Events/Bootstrap/P1.jsonl
        - Source/Providers/OpenAIResponses/
        - Source/Providers/OpenAIChatCompletions/
        - Source/Providers/AnthropicMessages/
        - Source/Channels/QQ/
      Budget:
        CoreDocumentsTargetPercent: 10
        TaskReferencesTargetPercent: 25
        ImplementationContextReserveMinimumPercent: 50
        MeasurementMode: EstimateUntilTelemetryExists
      MaxReferenceFiles: 12
      ExpansionReasonRequired: true
    WriteSet:
      - Source/Core/CredentialLease.h
      - Source/Core/CoreAuthorizedAction.h
      - Source/Core/AgentRuntimePort.h
      - Source/Core/IdentityPolicy.h
      - Source/Core/IdentityPolicy.cpp
      - Source/Core/CoreChatService.h
      - Source/Core/CoreChatService.cpp
      - Tests/Contract/Core/IdentityPolicyTests.cpp
      - Tests/Contract/Core/CoreChatServiceContractTests.cpp
      - Tests/Contract/Channels/Contracts/MockChannelAdapter.h
      - Tests/Contract/Channels/Contracts/MockChannelAdapter.cpp
      - Tests/Contract/Channels/Contracts/MockChannelContractTests.cpp
      - Tests/Contract/Channels/Contracts/CoreAuthorizedActionTestFactory.h
    SharedLocks: [MockChannelCoreAuthorizationSeam]
    ApiDesign:
      AuthorizedTurnContext: "Core-only construction; immutable mapped PrincipalId, exact ConversationScope, AgentTurnId, and canonical messages."
      AgentRuntimePort: "Agent implements Core::AgentRuntimePort::RunTurn(const AuthorizedTurnContext&, Providers::ModelProviderPort&, const Providers::ModelProviderProfile&, const Providers::CredentialLease&, std::stop_token) -> AgentTurnResult; the interface exposes no Channel identity or authorization constructor."
      AgentTurnResult: "Typed status Completed/Refused/Failed/Cancelled/UnknownOutcome plus final text only for a completed answer/refusal; partial text is never a sendable result."
      CoreCredentialLease: "Core::CredentialLease is a noncopyable borrowed secret interface used only for ChannelAdapterPort calls; Provider::CredentialLease remains a distinct port type."
      CoreAuthorizedAction: "Core-only construction; immutable ActionId, OperationId, IdempotencyKey, exact target conversation, SendText kind, text payload, and AuthorizationRef."
      ReceiptRule: "Core reports send success only for one Succeeded ChannelReceipt whose ActionId and OperationId exactly match the issued action; UnknownOutcome is never retried."
      MockMigration: "Replace the test-only stand-in action type with the Core type. Scripted receipts match exact ActionId/OperationId values, not object addresses, so an end-to-end Core-created action can be acknowledged without fabricating an uncorrelated result."
    Acceptance:
      - AcceptanceId: AC-1
        Description: "Registered account and sender map only from the trusted ChannelEnvelope to one Principal and exact ConversationScope."
        Evidence: "Contract tests cover valid mapping, unknown sender/account, route mismatch, empty identifiers, and duplicate StableDeduplicationId."
      - AcceptanceId: AC-2
        Description: "Core does not run AgentRuntime or send a channel action for rejected, duplicate, or unsupported messages."
        Evidence: "Fake AgentRuntime and MockChannel counters remain zero on each rejection path."
      - AcceptanceId: AC-3
        Description: "Only a completed final AgentRuntime result can produce a private CoreAuthorizedAction; Provider or message fields cannot grant identity or permission."
        Evidence: "Tests assert authorization object construction boundary and no send on refused, failed, cancelled, limited, or unknown outcome."
      - AcceptanceId: AC-4
        Description: "Core checks SendText capability evidence and exact receipt correlation and does not retry UnknownOutcome."
        Evidence: "Tests cover unsupported/unverified capability, mismatched IDs, rejection, and unknown receipt."
      - AcceptanceId: AC-5
        Description: "All changed production Core sources meet at least 80 percent line coverage with the task-pinned compiler and gcov version."
        Evidence: "Fresh task build, per-source gcov report, denominator, exclusions, and tool version in ReviewBundle."
    Validation:
      RequiredTargets: [CoreChatServiceContractTests, MockChannelContractTests]
      TargetedBuild:
        - "Windows PowerShell: g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. Source/Core/IdentityPolicy.cpp Source/Core/CoreChatService.cpp Tests/Contract/Core/IdentityPolicyTests.cpp Tests/Contract/Core/CoreChatServiceContractTests.cpp Tests/Contract/Channels/Contracts/MockChannelAdapter.cpp Tests/Contract/Channels/Contracts/MockChannelContractTests.cpp -o <TaskBuildDir>/CoreChatServiceContractTests.exe"
        - "<TaskBuildDir>/CoreChatServiceContractTests.exe"
      ContractFixtures: ["Trusted envelope, sender mapping, deduplication, verified SendText, receipt correlation, and no-retry cases."]
      StaticChecks: ["git diff --check BaseCommit HeadCommit", "Changed paths exactly equal frozen WriteSet", "C++20 warnings-as-errors build", "Core production line coverage >=80%"]
      LiveSideEffects: Forbidden
      NotRunReason: "No network, provider credentials, real QQ account, or user data is permitted in this slice."
    RiskLevel: High
    RiskOwnerRole: CoreOwner
    RequiresCredentials: false
    RequiresExternalAccount: false
    Rules:
      MustFollow: [SEC-001, GOV-001, API-001, PAR-002]
      SoftDefaults: []
      ApprovedOverrides: ["CR-ED-0018-002 changes only the MockChannel test receipt key from object identity to exact action/operation ID matching."]
    Deliverable:
      PullRequestSummaryRequired: true
      TaskReportFile: false
      EventShard: Workflow/Events/CodexRewrite/P2.jsonl
      FollowUpTaskIds: [ED-0101, ED-0108, ED-0110, ED-0111, ED-0115]

