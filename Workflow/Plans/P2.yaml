    SharedLocks: [CoreAgentRuntimePort, CoreOperationRecordState, MockChannelCoreAuthorizationSeam]
    ApiDesign:
      AuthorizedTurnContext: "Core-only construction; immutable mapped PrincipalId, exact ConversationScope, AgentTurnId, and canonical messages."
      AgentRuntimePort: "Agent implements Core::AgentRuntimePort::RunTurn(const AuthorizedTurnContext&, Providers::ModelProviderPort&, const Providers::ModelProviderProfile&, const Providers::CredentialLease&, std::stop_token) -> AgentRunResult; ResponseReady is not a CoreAgent terminal state, and the interface exposes no Channel identity or authorization constructor."
      AgentRunResult: "Port-local status ResponseReady/Failed/Cancelled/Unsupported/UnknownOutcome. ResponseReady carries CompletionKind FinalAnswer or Refusal and only complete final text; it is not a CoreAgent terminal state. Failed carries a typed AgentRunFailureCode. Refusal is a completion kind and refusal metadata is never authorization. Partial text is never sendable."
      AgentRunFailureCode: "InvalidProfile, InvalidRequest, UnsupportedCapability, AuthenticationFailure, RateLimited, TransportFailure, InvalidStream, ProviderRejected, ContentFiltered, OutputLimitReached, InternalError. A ResponseOutputLimited event may be followed only by a Core-approved budget compaction/retry with a new RequestId as allowed by CoreAgent V1; only when that bounded retry path is unavailable or exhausted may the final AgentRunResult be Failed/OutputLimitReached, with no ResponseReady, CoreAuthorizedAction, or Channel send. ResponseFailed maps its ModelProviderContract FailureCode one-to-one to the same AgentRunFailureCode name; ResponseCancelled maps to Cancelled; ResponseOutcomeUnknown maps to UnknownOutcome and is never retried. Core policy denial is represented by CoreChatService, not AgentRunFailureCode."
      FailureCodeMapping: "Providers::FailureCode InvalidProfile, InvalidRequest, UnsupportedCapability, AuthenticationFailure, RateLimited, TransportFailure, InvalidStream, ProviderRejected, and ContentFiltered map one-to-one to Core::AgentRunFailureCode. OutputLimitReached is only a final Core error after the CoreAgent V1 approved retry/compaction path is unavailable or exhausted; it is not a Provider FailureCode. Cancelled and UnknownOutcome are separate AgentRunResult statuses."
      CoreChatServiceStateMapping: "CoreChatService owns CoreAgent V1 AgentTurnState; it transitions Generating->Sending only after a complete ResponseReady is approved, and to Completed only after one exact matching Succeeded ChannelReceipt. AgentRunResult.ResponseReady never means AgentTurn.Completed."
      CoreCredentialLease: "Core::CredentialLease is a noncopyable borrowed secret interface used only for ChannelAdapterPort calls; Provider::CredentialLease remains a distinct port type."
      CoreAuthorizedAction: "Private construction by CoreChatService only; immutable ActionId, OperationId, IdempotencyKey, exact Core ConversationScope, SendText ActionKind, text payload, opaque AuthorizationRef, PolicyVersion, and CapabilitySnapshotVersion."
      CoreAuthorizedActionReadApi: "GetActionId()->const Channels::ActionId&; GetOperationId()->const Channels::OperationId&; GetIdempotencyKey()->const Channels::IdempotencyKey&; GetTargetScope()->const Core::ConversationScope&; GetActionKind()->Core::CoreAuthorizedActionKind; GetTextPayload()->std::string_view (valid only for SendText); GetAuthorizationRef()->const Core::AuthorizationRef&; GetPolicyVersion()->std::uint64_t; GetCapabilitySnapshotVersion()->std::uint64_t. All accessors are const/read-only."
      CoreActionIdSource: "Define CoreActionIdentifiers {Channels::ActionId ActionId; Channels::OperationId OperationId; Channels::IdempotencyKey IdempotencyKey;} and CoreActionIdSource::Next()->CoreActionIdentifiers in CoreChatService.h. CoreChatService requires a CoreActionIdSource& dependency and obtains one fresh, nonempty tuple only after policy/capability approval and before creating OperationRecord/CoreAuthorizedAction; duplicate or empty identifiers fail closed with no send. The test uses a deterministic queued implementation to pre-script a matching ChannelReceipt. The source creates identifiers only and never constructs or authorizes CoreAuthorizedAction; production ID generation is supplied by the Core composition root."
      VersionChecks: "CoreChatService derives PolicyVersion from active Core policy and CapabilitySnapshotVersion from Channel CapabilitySnapshot.SnapshotVersion; it validates both immediately before dispatch."
      TestConstruction: "Tests do not construct CoreAuthorizedAction or become friends of it; the Core contract test injects a deterministic CoreActionIdSource and drives the normal CoreChatService authorization path with FakeAgentRuntime and an instrumented FakeChannelAdapter."
      ReceiptRule: "Core reports send success only for one Succeeded ChannelReceipt whose ActionId and OperationId exactly match the issued action; UnknownOutcome is never retried."
      OperationRecord: "Create an in-memory scoped OperationRecord with PolicyVersion and CapabilitySnapshotVersion before any Channel SendAction; authorize it, mark Dispatched before the call, and transition from its exact receipt to Succeeded/Rejected/Unsupported/Failed/UnknownOutcome. This is not durable restart recovery; ED-0112 owns that capability."
    Acceptance:
