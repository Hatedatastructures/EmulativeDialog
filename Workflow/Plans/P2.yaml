      CoverageCommand: |-
        $ErrorActionPreference = 'Stop'
        $Worktree = 'H:/Qbot/EmulativeDialog.ED-0146'
        $Build = 'H:/Qbot/EmulativeDialog.integration-port-contract.build/ED-0146/Network'
        $ReportRoot = 'H:/Qbot/EmulativeDialog.integration-port-contract.build/ED-0146/Reports'
        $Gxx = 'C:/msys64/ucrt64/bin/g++.exe'
        $Gcov = 'C:/msys64/ucrt64/bin/gcov.exe'
        $ExpectedVersion = '16.1.0'
        $WarningPattern = '(?im)(?:libgcov|profiling)[^\r\n]*(?:checksum|overwrit\w*)|(?:checksum|overwrit\w*)[^\r\n]*(?:libgcov|profiling)'

        function Normalize-CoveragePath([string]$Path, [string]$BaseDirectory) {
          $Value = $Path.Replace('/', '\')
          if (-not [System.IO.Path]::IsPathRooted($Value)) { $Value = Join-Path $BaseDirectory $Value }
          return [System.IO.Path]::GetFullPath($Value).TrimEnd('\').ToLowerInvariant()
        }

        function Read-CoverageJson([string]$Path) {
          $InputStream = [System.IO.File]::OpenRead($Path)
          try {
            $ZipStream = [System.IO.Compression.GzipStream]::new($InputStream, [System.IO.Compression.CompressionMode]::Decompress)
            try {
              $Reader = [System.IO.StreamReader]::new($ZipStream)
              try { $JsonText = $Reader.ReadToEnd() } finally { $Reader.Dispose() }
            } finally { $ZipStream.Dispose() }
          } finally { $InputStream.Dispose() }
          return (ConvertFrom-Json -InputObject $JsonText -ErrorAction Stop)
        }

        function Measure-Coverage([string]$Label, [string]$GcnoName, [string]$ExpectedDataFile, [string]$GcovInputPath, [string]$CoverageSourcePath, [string]$RunDirectory) {
          $Notes = @(Get-ChildItem -LiteralPath $Build -Recurse -File -Filter $GcnoName)
          if ($Notes.Count -ne 1) { throw "Expected one $GcnoName; found $($Notes.Count)" }
          $ObjectPath = [System.IO.Path]::ChangeExtension($Notes[0].FullName, '.obj')
          $DataPath = [System.IO.Path]::ChangeExtension($Notes[0].FullName, '.gcda')
          foreach ($RequiredPath in @($ObjectPath, $DataPath)) {
            if (-not (Test-Path -LiteralPath $RequiredPath -PathType Leaf)) { throw "Missing gcov input: $RequiredPath" }
          }

          New-Item -ItemType Directory -Path $RunDirectory | Out-Null
          Push-Location -LiteralPath $RunDirectory
          try {
            $Output = @(& $Gcov --json-format --branch-counts --preserve-paths -o $ObjectPath $GcovInputPath 2>&1)
            $ExitCode = $LASTEXITCODE
          } finally { Pop-Location }
          $OutputText = ($Output | ForEach-Object { [string]$_ }) -join "`n"
          if ($ExitCode -ne 0) { throw "gcov failed for $Label with exit ${ExitCode}: $OutputText" }
          if ($OutputText -match $WarningPattern) { throw "gcov reported stale/conflicting data for ${Label}: $OutputText" }

          $JsonFiles = @(Get-ChildItem -LiteralPath $RunDirectory -File -Filter '*.gcov.json.gz')
          if ($JsonFiles.Count -ne 1) { throw "Expected one gcov JSON for $Label; found $($JsonFiles.Count)" }
          $Json = Read-CoverageJson $JsonFiles[0].FullName
          if ([string]$Json.format_version -ne '2' -or [string]$Json.gcc_version -ne $ExpectedVersion) { throw "Wrong gcov JSON version for $Label" }

          $ExpectedDataPath = Normalize-CoveragePath $ExpectedDataFile $Worktree
          $ActualDataPath = Normalize-CoveragePath ([string]$Json.data_file) $Build
          if ($ExpectedDataPath -ne $ActualDataPath) { throw "gcov data_file mismatch for ${Label}: $ActualDataPath" }
          $ExpectedSourcePath = Normalize-CoveragePath $CoverageSourcePath $Worktree
          $Records = @($Json.files | Where-Object { (Normalize-CoveragePath ([string]$_.file) ([string]$Json.current_working_directory)) -eq $ExpectedSourcePath })
          if ($Records.Count -ne 1) { throw "Expected one source record for $Label; found $($Records.Count)" }

          $LineCoverage = @{}
          foreach ($Line in @($Records[0].lines)) {
            if ($null -eq $Line.line_number -or $null -eq $Line.count) { throw "Missing line fields for $Label" }
            $LineNumber = [int]$Line.line_number
            $Count = [long]$Line.count
            if ($LineNumber -le 0 -or $Count -lt 0) { throw "Invalid line record for $Label" }
            if (-not $LineCoverage.ContainsKey($LineNumber)) { $LineCoverage[$LineNumber] = $false }
            if ($Count -gt 0) { $LineCoverage[$LineNumber] = $true }
          }
          $Total = $LineCoverage.Count
          if ($Total -eq 0) { throw "Empty executable-line denominator for $Label" }
          $Covered = 0
          foreach ($Hit in $LineCoverage.Values) { if ($Hit) { $Covered++ } }
          $Percent = 100.0 * $Covered / $Total
          $PercentText = $Percent.ToString('F2', [System.Globalization.CultureInfo]::InvariantCulture)
          Write-Output "$Label COVERED=$Covered EXECUTABLE=$Total PERCENT=$PercentText JSON=2 GCC=$($Json.gcc_version) REPORT=$($JsonFiles[0].FullName)"
          if (($Covered * 100) -lt ($Total * 80)) { throw "$Label coverage is below 80 percent" }
        }

        try {
          $CompilerVersion = (& $Gxx --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $CompilerVersion -notmatch [regex]::Escape($ExpectedVersion)) { throw "Expected GCC ${ExpectedVersion}: $CompilerVersion" }
          $GcovVersion = (& $Gcov --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $GcovVersion -notmatch [regex]::Escape($ExpectedVersion) -or $GcovVersion -notmatch 'JSON format version:\s*2') { throw "Expected gcov $ExpectedVersion with JSON v2: $GcovVersion" }

          New-Item -ItemType Directory -Force -Path $ReportRoot | Out-Null
          $RunRoot = Join-Path $ReportRoot ('Run-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $RunRoot | Out-Null
          Measure-Coverage 'HttpTransportPort.hpp' 'HttpTransportPortTests.cpp.gcno' 'Tests/Contract/Platform/Network/HttpTransportPortTests.cpp' 'Tests/Contract/Platform/Network/HttpTransportPortTests.cpp' 'Source/Platform/Network/HttpTransportPort.hpp' (Join-Path $RunRoot 'Port')
          Measure-Coverage 'WinHttpTransport.cpp' 'WinHttpTransport.cpp.gcno' 'Source/Platform/Network/WinHttpTransport.cpp' 'Source/Platform/Network/WinHttpTransport.cpp' 'Source/Platform/Network/WinHttpTransport.cpp' (Join-Path $RunRoot 'WinHttp')
          Write-Output "GXX_VERSION=$ExpectedVersion GCOV_VERSION=$ExpectedVersion GCOV_JSON_FORMAT=2 REPORT_ROOT=$RunRoot"
        } catch {
          [Console]::Error.WriteLine($_.Exception.Message)
          exit 1
        }
