      CoverageCommand: |-
        $ErrorActionPreference = 'Stop'
        $Worktree = 'H:/Qbot/EmulativeDialog.ED-0112-R5'
        $Build = 'H:/Qbot/EmulativeDialog.integration-port-contract.build/ED-0112-R8/windows-agent-slice'
        $ReportRoot = Join-Path $Build 'Reports'
        $TestLog = Join-Path $Build 'Testing/Temporary/LastTest.log'
        $WarningPattern = '(?im)(?:libgcov|profiling)[^\r\n]*(?:checksum|overwrit\w*)|(?:checksum|overwrit\w*)[^\r\n]*(?:libgcov|profiling)'
        if (-not (Test-Path -LiteralPath $TestLog -PathType Leaf)) { throw "Missing CTest log: $TestLog" }
        $TestLogLines = [System.IO.File]::ReadAllLines($TestLog)
        $TestLogText = $TestLogLines -join [Environment]::NewLine
        if ($TestLogText -match $WarningPattern) { throw 'CTest log contains a libgcov checksum/overwrite warning.' }

        foreach ($TestName in @('Storage.TurnCheckpointStore', 'Core.TurnRecoveryCoordinator')) {
          $Starts = @()
          for ($Index = 0; $Index -lt $TestLogLines.Count; $Index++) {
            if ($TestLogLines[$Index] -match '^\d+/\d+\s+Testing:') { $Starts += $Index }
          }
          $PassingBlocks = 0
          for ($BlockIndex = 0; $BlockIndex -lt $Starts.Count; $BlockIndex++) {
            $Start = $Starts[$BlockIndex]
            $End = if ($BlockIndex + 1 -lt $Starts.Count) { $Starts[$BlockIndex + 1] - 1 } else { $TestLogLines.Count - 1 }
            $Block = @($TestLogLines[$Start..$End])
            $EscapedName = [regex]::Escape($TestName)
            $NamedTest = @($Block | Where-Object { $_ -match "^\d+/\d+\s+Test:\s+$EscapedName$" })
            $PassedTest = @($Block | Where-Object { $_ -match '^Test Passed\.$' })
            if ($NamedTest.Count -gt 0 -and $PassedTest.Count -gt 0) { $PassingBlocks++ }
          }
          if ($PassingBlocks -ne 1) { throw "Expected exactly one passing CTest block for $TestName; found $PassingBlocks." }
        }

        function Normalize-Path([string]$Path, [string]$BaseDirectory) {
          $Value = $Path.Replace('/', '\')
          if (-not [System.IO.Path]::IsPathRooted($Value)) { $Value = Join-Path $BaseDirectory $Value }
          return [System.IO.Path]::GetFullPath($Value).TrimEnd('\').ToLowerInvariant()
        }
        foreach ($SourceName in @('TurnCheckpointStore', 'TurnRecoveryCoordinator')) {
          $SourcePath = if ($SourceName -eq 'TurnCheckpointStore') { Join-Path $Worktree 'Source/Storage/TurnCheckpointStore.cpp' } else { Join-Path $Worktree 'Source/Core/TurnRecoveryCoordinator.cpp' }
          $NoteFiles = @(Get-ChildItem -LiteralPath $Build -Recurse -File -Filter "$([System.IO.Path]::GetFileName($SourcePath)).gcno")
          $DataFiles = @(Get-ChildItem -LiteralPath $Build -Recurse -File -Filter "$([System.IO.Path]::GetFileName($SourcePath)).gcda")
          if ($NoteFiles.Count -ne 1 -or $DataFiles.Count -ne 1) { throw "Expected one fresh .gcno/.gcda pair for $SourceName; found $($NoteFiles.Count)/$($DataFiles.Count)." }
          if ($DataFiles[0].LastWriteTimeUtc -lt $NoteFiles[0].LastWriteTimeUtc) { throw "Coverage data predates the compile notes for $SourceName." }
          if ((Get-Item -LiteralPath $TestLog).LastWriteTimeUtc -lt $DataFiles[0].LastWriteTimeUtc) { throw "CTest evidence predates the coverage data for $SourceName." }
          $ReportPath = Join-Path $ReportRoot "$SourceName.gcov.json.gz"
          if (-not (Test-Path -LiteralPath $ReportPath -PathType Leaf)) { throw "Missing gcov JSON v2 report: $ReportPath" }
          $ReportInfo = Get-Item -LiteralPath $ReportPath
          if ($ReportInfo.LastWriteTimeUtc -lt $DataFiles[0].LastWriteTimeUtc -or $ReportInfo.LastWriteTimeUtc -lt (Get-Item -LiteralPath $TestLog).LastWriteTimeUtc) { throw "Coverage report predates current CTest/profile data for $SourceName." }
          $InputStream = [System.IO.File]::OpenRead($ReportPath)
          try {
            $GzipStream = [System.IO.Compression.GzipStream]::new($InputStream, [System.IO.Compression.CompressionMode]::Decompress)
            try {
              $Reader = [System.IO.StreamReader]::new($GzipStream)
              try { $Document = $Reader.ReadToEnd() | ConvertFrom-Json -ErrorAction Stop } finally { $Reader.Dispose() }
            } finally { $GzipStream.Dispose() }
          } finally { $InputStream.Dispose() }
          if ([int]$Document.format_version -ne 2 -or [string]$Document.gcc_version -notmatch '^16\.1\.0') { throw "Unexpected gcov JSON/toolchain version for $SourceName." }
          $ExpectedPath = Normalize-Path $SourcePath $Worktree
          $SourceBase = if ([string]::IsNullOrWhiteSpace([string]$Document.current_working_directory)) { $Worktree } else { [string]$Document.current_working_directory }
          $SourceRecords = @($Document.files | Where-Object { (Normalize-Path ([string]$_.file) $SourceBase) -eq $ExpectedPath })
          if ($SourceRecords.Count -ne 1) { throw "Expected one exact files[].file record for $ExpectedPath; found $($SourceRecords.Count)." }
          $LineCoverage = @{}
          foreach ($Line in @($SourceRecords[0].lines)) {
            if ($null -eq $Line.line_number -or $null -eq $Line.count) { throw "Missing executable line fields for $SourceName." }
            $LineNumber = [int]$Line.line_number
            $Count = [long]$Line.count
            if ($LineNumber -le 0 -or $Count -lt 0) { throw "Invalid executable line record for $SourceName." }
            if (-not $LineCoverage.ContainsKey($LineNumber)) { $LineCoverage[$LineNumber] = $false }
            if ($Count -gt 0) { $LineCoverage[$LineNumber] = $true }
          }
          $Total = $LineCoverage.Count
          $Covered = 0
          foreach ($Hit in $LineCoverage.Values) { if ($Hit) { $Covered++ } }
          if ($Total -le 0) { throw "No executable lines found for $SourceName." }
          $Percent = [math]::Round(($Covered * 100.0) / $Total, 2)
          if (($Covered * 100) -lt ($Total * 80)) { throw "$SourceName coverage $Covered/$Total ($Percent%) is below 80%." }
          Write-Output "COVERAGE_OK source=$SourceName covered=$Covered total=$Total excluded=0 percent=$Percent gcc=$($Document.gcc_version) json=2"
        }
      ContractFixtures: ["Synthetic restart checkpoints, exact scoped ContextReference, revoked scope, deleted record, and unknown action outcome; no message rehydration or runtime dispatch is claimed."]
