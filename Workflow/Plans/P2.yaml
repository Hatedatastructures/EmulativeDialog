        Description: "Registered account and sender map only from the trusted ChannelEnvelope to one Principal and exact ConversationScope."
        Evidence: "Contract tests cover valid mapping, unknown sender/account, route mismatch, empty identifiers, and duplicate StableDeduplicationId."
      - AcceptanceId: AC-2
        Description: "Core does not run AgentRuntime or send a channel action for rejected, duplicate, or unsupported messages."
        Evidence: "Fake AgentRuntime and instrumented FakeChannelAdapter counters remain zero on rejected, duplicate, and unsupported inbound message paths. ED-0109 does not depend on the later ED-0125 MockChannel migration."
      - AcceptanceId: AC-3
        Description: "Only a complete, policy-approved AgentRunResult with nonempty final user-visible text can lead CoreChatService to construct a private CoreAuthorizedAction; Provider or message fields cannot grant identity or permission."
        Evidence: "Tests assert CoreChatService-only construction, deterministic ID-source injection, and exact policy/capability version binding; Provider FailureCode mappings are table-checked; after any Core-approved bounded compaction/retry is exhausted, typed Failed/OutputLimitReached produces no action or send; no action is created on Failed, Cancelled, Unsupported, invalid, or UnknownOutcome. CoreAgent Completed is set only after the exact matching Succeeded ChannelReceipt. Refusal metadata alone never authorizes an action."
      - AcceptanceId: AC-4
        Description: "Core creates the scoped OperationRecord and authorizes it before SendAction, marks Dispatched before the adapter call, updates from one correlated receipt, and never retries UnknownOutcome."
        Evidence: "An instrumented fake Channel asserts the record is Authorized/Dispatched before SendAction and is transitioned after Succeeded, Rejected, or UnknownOutcome."
