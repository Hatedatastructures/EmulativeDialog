      - "S is the authorization source; the conflicted P1 EventShard must not be used to authorize its own recovery."
      - "Coordinator has explicitly selected occurrence 2 for each of the five target IDs below after inspecting the raw variants."
    ChangeRequest:
      ChangeRequestId: CR-ED-0014-001
      RequestedByRole: Coordinator
      RequestedByAgentId: /root
      Decision: Accepted
      ApprovedByRole: Coordinator
      ApprovedByAgentId: /root
      Scope: >-
        Add a workflow-declared, single-writer bootstrap recovery command to WorkflowController that reads
        authorization only from this frozen TaskSpec snapshot and appends explicit EventIdConflictResolution
        records for the five listed ED-0013 event IDs; do not modify the original event lines.
      Reason: >-
        The ordinary P1 EventStore reader and appender fail closed on conflicting EventIds, preventing task
        context loading and ordinary assignment. An isolated, immutable Coordinator TaskSpec pin provides a
        non-circular workflow authorization source for a narrowly scoped append-only recovery command.
      TrustLimit: "Workflow provenance only; not cryptographic or operating-system authentication."
    PreVerifyIntegrationGate:
      P1ExitGate: Pending
      BootstrapControllerRemediationAllowed: true
      ProductAgentRuntimeMayStart: false
    BaselineCommit: de48c7899c5b2fa7b3c0674040db10cd6660106d
    HeadCommit: ""
    Branch: Task/ED-0014-R6-EventIdConflictRecovery
    Worktree: H:/Qbot/EmulativeDialog.ED-0014-R6
    Context:
      ModuleId: AgentWorkflowController
      ReadSet:
        - AGENTS.md
        - Workflow/CurrentState.md
        - Workflow/TaskIndex.yaml
        - Workflow/TaskTemplate.yaml
        - Workflow/TaskLifecycle.md
        - Workflow/AgentExecutionStandard.md
