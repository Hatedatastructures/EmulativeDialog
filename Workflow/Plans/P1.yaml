        - Verify changed paths equal the exact four-path WriteSet.
        - gcov --version
        - From H:/Qbot/EmulativeDialog.integration.build/windows-mingw, run gcov --relative-only --branch-counts -o CMakeFiles/WorkflowControllerCore.dir/Tools/WorkflowController/WorkflowController.cpp.obj Tools/WorkflowController/WorkflowController.cpp.
        - From H:/Qbot/EmulativeDialog.integration.build/windows-mingw, run gcov --relative-only --branch-counts -o CMakeFiles/WorkflowController.dir/Tools/WorkflowController/Main.cpp.obj Tools/WorkflowController/Main.cpp.
        - Retain generated .gcov reports under H:/Qbot/EmulativeDialog.integration.build/windows-mingw.
        - Verify combined changed-production-source line coverage >= 80 percent and record denominator, executable count, exclusions, and gcov version.
      LiveSideEffects: Forbidden
      NotRunReason: ""
    RiskLevel: High
    RiskOwnerRole: Coordinator
