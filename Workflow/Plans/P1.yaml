          EventShard: Workflow/Events/Bootstrap/P1.jsonl
          TargetEventId: 4a9507a0-c338-40f0-8871-f15aff82be1c
          Scope: {ReleaseId: Bootstrap, PhaseId: P1, TaskId: ED-0013, TaskRevision: 1}
          ExpectedVariantCount: 2
          ExpectedOccurrenceCount: 2
