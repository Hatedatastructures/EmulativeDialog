        - "Resolution events retain the required common event envelope and safe EvidenceRefs; never store raw payload, chat text, command output, payload hashes, or merged EvidenceRefs."
        - "The resolution event's common TaskId/TaskRevision identify ED-0014/revision 6; the original event's full ReleaseId/PhaseId/TaskId/TaskRevision appear only in the nested target-scope payload. Derive event AgentId/AgentRole specifically from the matching ApprovedOverrides ApprovedByAgentId/ApprovedByRole (Coordinator /root), never from the ED-0014 Worker01 task owner."
        - "Only the four exact C++/test paths in WriteSet may change."
        - "Require at least 80 percent line coverage for changed production translation units and report denominator, exclusions, and gcov version."
