Tasks:
  - TaskId: ED-0006
    TaskRevision: 1
    EpicId: EP-05
    Title: 建立 Windows 原生 C++20 CMake 与依赖基线
    TaskKind: Build
    State: Merged
    Phase: P1
    OwnerRole: BuildAndDependencyOwner
    OwnerSlotId: Worker01
    OwnerAgentId: "/root/workflow_controller"
    ReviewerRole: Coordinator
    ReviewerAgentId: "/root"
    CreatedBy: Coordinator
    ParallelGroup: WindowsBuildAndContractFreeze
    Goal: "提供可复用的 Windows 原生 C++20 配置、构建与最小编译验证目标，并固定首批 C++ 依赖。"
    OutOfScope:
      - Codex AgentRuntime 产品行为
      - Provider/Channel/Memory 实现
      - WSL 构建或验收
      - 非 C++ 发布运行时
    DependsOn: []
    ExternalInputs:
      - https://www.boost.org/releases/1.92.0/
      - https://github.com/boostorg/boost/tree/afdfa32505af73e3d208144b3f623f0096cb62b6
      - https://github.com/jbeder/yaml-cpp/releases/tag/yaml-cpp-0.9.0
      - https://github.com/jbeder/yaml-cpp/blob/56e3bb550c91fd7005566f19c079cb7a503223cf/LICENSE
      - https://cmake.org/cmake/help/latest/manual/cmake-presets.7.html
    ContractVersion:
      - Standards/CppEngineeringStandard.md at BaseCommit
      - Standards/DependencyPolicy.md at BaseCommit
    GoalFrozen: true
    ReadSet:
      - AGENTS.md
      - Standards/CppEngineeringStandard.md
      - Standards/DependencyPolicy.md
      - Architecture/ModuleMap.yaml
      - Architecture/Modules/BuildRelease.yaml
      - Architecture/Modules/Platform.yaml
      - Workflow/EnforcementMatrix.yaml
    WriteSet:
      - CMakeLists.txt
      - CMakePresets.json
      - CMake/
      - Standards/DependencyPolicy.md
    ForbiddenSet:
      - Source/**
      - Tests/**
      - Tools/**
    SharedLocks:
      - RootCMakeAndPresets
      - DependencyLock
    Acceptance:
      - AcceptanceId: AC-1
        Description: Configure a Windows-native C++20 build preset using the available MinGW compiler and generator; do not use WSL.
        Evidence: CMake configure output identifies the native Windows C++ compiler and C++20 target.
      - AcceptanceId: AC-2
        Description: Build and execute a small C++20 probe with a compile-time standard assertion; the probe is build verification only and is not a product runtime.
        Evidence: Build and CTest output for the named BuildProbe target.
      - AcceptanceId: AC-3
        Description: Record exact source/version/license/use of Boost 1.92.0 and yaml-cpp 0.9.0; dependency declarations use immutable commit pins.
        Evidence: DependencyPolicy entries and CMake dependency declarations.
      - AcceptanceId: AC-4
        Description: Keep generated build files outside the source worktree.
        Evidence: CMakePreset binaryDir resolves to a worktree-specific sibling build directory.
    Validation:
      RequiredTargets:
        - BuildProbe
      TargetedBuild:
        - cmake --preset windows-mingw
        - cmake --build --preset windows-mingw
      ContractFixtures:
        - ctest --preset windows-mingw --output-on-failure
      StaticChecks:
        - C++20 static_assert in BuildProbe.cpp
        - Dependency versions and immutable hashes match DependencyPolicy.md
      LiveSideEffects: Forbidden
      NotRunReason: ""
    RiskLevel: Medium
    RiskOwnerRole: BuildAndDependencyOwner
    RequiresCredentials: false
    RequiresExternalAccount: false
    BaselineCommit: c0792ea36b443fc984ea04542f6895457d33a569
