    Goal: "将第一条产品纵向切片依赖的公共身份、回合、Provider、Memory 和 Mock Channel 语义冻结为 V1 合同。"
    OutOfScope:
      - C++ Provider/Channel/Memory 实现
      - 真实 QQ 登录或发送
      - 微信调研或实现
      - 通用 MCP、Shell、文件或任意网络工具
    DependsOn: []
    ExternalInputs:
      - https://developers.openai.com/api/docs/guides/streaming-responses
      - https://developers.openai.com/api/reference/resources/chat/subresources/completions/streaming-events
      - https://platform.claude.com/docs/en/api/versioning
      - https://platform.claude.com/docs/en/api/migration-2026-10-21
      - Workflow/Communications/Bootstrap/P1.jsonl
    ContractVersion: V1
    GoalFrozen: true
    ReadSet:
      - AGENTS.md
      - Goals/ProductGoals.md
      - Architecture/Decisions/Adr0002CodexAgentCppRewrite.md
      - Workflow/CodexCapabilityMap.yaml
      - Workflow/CodexCapabilityMap/AgentCore.yaml
      - Architecture/ModuleMap.yaml
      - Architecture/Modules/HostCoreAgent.yaml
      - Architecture/Modules/Providers.yaml
      - Architecture/Modules/Channels.yaml
      - Architecture/Modules/MemoryStorage.yaml
      - Architecture/Contracts/CoreAgentContract.md
      - Architecture/Contracts/ModelProviderContract.md
      - Architecture/Contracts/MemoryContract.md
      - Architecture/Contracts/ChannelAdapterContract.md
      - Standards/SecurityAndPrivacy.md
      - Workflow/Communications/Bootstrap/P1.jsonl
    WriteSet:
      - Architecture/Contracts/CoreAgentContract.md
      - Architecture/Contracts/ModelProviderContract.md
      - Architecture/Contracts/MemoryContract.md
      - Architecture/Contracts/ChannelAdapterContract.md
    ForbiddenSet:
      - Source/**
      - Tests/**
    SharedLocks:
      - CrossModuleContractVersions
    Acceptance:
      - AcceptanceId: AC-1
        Description: Freeze trusted ChannelEnvelope identity, Core-only scope/authorization, turn lifecycle, cancellation, error, recovery, and unknown-outcome semantics.
        Evidence: CoreAgentContract V1 state/action matrix and rejection cases.
      - AcceptanceId: AC-2
        Description: Freeze CanonicalModelRequest/Event payloads, stable IDs/sequences, exactly-one provider terminal, tool-call result mapping, retry/unknown-outcome rules, and all three required wire protocol mappings.
        Evidence: ModelProviderContract V1 request/event tables and per-protocol offline fixture plans.
      - AcceptanceId: AC-3
        Description: Pin Anthropic wire version 2026-10-21 and an explicit profile authentication scheme; reject non-default sampling options unsupported by that version and define stop-reason/usage/cancellation semantics.
        Evidence: ModelProviderContract V1 Anthropic profile with official source references.
      - AcceptanceId: AC-4
        Description: Freeze identity/session memory scopes, explicit write consent, provenance, bounded context priority, sensitive-data rejection, and forget/tombstone behavior.
        Evidence: MemoryContract V1 acceptance/fixture matrix.
      - AcceptanceId: AC-5
        Description: Freeze the MockChannel/ChannelAdapter port contract, capability-denied receipts, UnsupportedCapability, and UnknownOutcome; keep real QQ account capabilities behind ED-0003/ED-0004 and WeChat Deferred.
        Evidence: ChannelAdapterContract V1 MockChannel scenario and scope table.
    Validation:
      RequiredTargets: []
      TargetedBuild: []
      ContractFixtures:
        - Independent review of all four versioned contract files against AC-1 through AC-5.
      StaticChecks:
        - All cross-module data and state outcomes have one canonical definition.
        - No protocol-specific fields or authorization policy leak into the wrong module.
      LiveSideEffects: Forbidden
      NotRunReason: "Contract-only task; runtime verification belongs to dependent implementation tasks."
    RiskLevel: High
    RiskOwnerRole: ContractOwner
    RequiresCredentials: false
    RequiresExternalAccount: false
