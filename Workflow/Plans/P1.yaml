  - TaskId: ED-0007
    TaskRevision: 1
    EpicId: EP-05
    Title: 冻结 Core、Provider、Memory 与 ChannelAdapter 公共合同
    TaskKind: ContractFreeze
    State: Active
    Phase: P1
    OwnerRole: ContractOwner
    OwnerSlotId: Worker02
    OwnerAgentId: "/root/agent_core"
    ReviewerRole: Coordinator
    ReviewerAgentId: "/root"
