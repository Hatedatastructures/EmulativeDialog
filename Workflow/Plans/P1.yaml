    RevisionChangeRequest:
      ChangeRequestId: CR-ED-0014-002
      RequestedByRole: Coordinator
      RequestedByAgentId: /root
      Decision: Accepted
      ApprovedByRole: Coordinator
      ApprovedByAgentId: /root
      Scope: >-
        Supersede ED-0014/R5 before code changes; explicitly add AGENTS.md, Workflow/CurrentState.md and
        Workflow/TaskIndex.yaml to the exact ReadSet and remove the unparsed nested BudgetOverride field.
        Bind resolution AgentId/AgentRole to the matching Coordinator ApprovedOverrides entry; add process-level
        CLI acceptance and executable MinGW gcov instrumentation/report commands while keeping the 80-percent
        line-coverage threshold. Keep the goal, four-path WriteSet and five approved event choices unchanged.
      Reason: >-
        Worker02 verified that the current Controller does not inject AlwaysLoad paths and does not parse
        Context.BudgetOverride. The corrected ReadSet is exactly 12 files including the three required entry files.
        The review also found missing gcov instrumentation/report commands and CLI-path coverage, so R6 adds
        explicit native coverage instrumentation and process-level acceptance without changing the 80-percent bar.
    Acceptance:
      - AcceptanceId: AC-1
        Description: >-
          The recovery command loads the exact ED-0014 TaskSpec from Coordinator-supplied immutable commit S and
          authorizes only matching ApprovedOverrides; it accepts no arbitrary AgentId/AgentRole flags and fails
          on an incorrect commit, scope, TaskRevision, ChangeRequestId, or target.
        Evidence: Positive pinned-authorization fixture plus negative wrong-pin/scope/target fixtures.
      - AcceptanceId: AC-2
        Description: >-
          Normal EventStore reads fail closed on unresolved variants. Recovery uses a raw, same-lock scan and
          explicit Coordinator choice; byte-identical duplicates remain a single event without resolution.
        Evidence: Synthetic shard fixtures prove both exact-duplicate and conflicting-variant paths.
      - AcceptanceId: AC-3
        Description: >-
          A resolution binds EventId, full target scope, distinct raw variant count, physical occurrence count,
          1-based canonical occurrence, approved TaskSpec commit/blob, CR ID, reason and common event envelope; it never
          merges EvidenceRefs or payload fields.
        Evidence: Serialized resolution schema tests include required Branch, CorrelationId, safe EvidenceRefs and reject raw payload/hash fields.
      - AcceptanceId: AC-4
        Description: >-
          The selected original event is preserved byte-for-byte, including unknown SourceHeadCommit on the 72cc
          fixture, in all event reads and ReviewBundle evidence. Original shard bytes remain an unchanged prefix.
        Evidence: Raw-record round-trip and prefix-preservation fixtures.
      - AcceptanceId: AC-5
        Description: >-
          Any stale count/pin, new occurrence, cross-scope variant, missing/multiple authorization, conflicting
          resolution payload, malformed or torn tail, partial write, or flush ambiguity remains fail closed;
          retry is idempotent and never blindly duplicates a possibly committed resolution.
        Evidence: Negative stale/partial/flush/concurrency and restart fixtures.
      - AcceptanceId: AC-6
        Description: >-
          The actual WorkflowController.exe command-line success and rejection paths are exercised against a
          disposable copy of the P1 event shard and the pinned TaskSpec; tests never pass the real P1 event file
          as a write target.
        Evidence: Process-level CLI tests cover an approved resolution, wrong pin/target rejection, and unchanged source bytes.
      - AcceptanceId: AC-7
        Description: Only the four exact WriteSet paths change; no real P1 event, task plan, or product source is modified.
        Evidence: Fixed BaseCommit..HeadCommit changed-path audit.
      - AcceptanceId: AC-8
        Description: >-
          Changed WorkflowController production translation units achieve at least 80 percent line coverage;
          report denominator, excluded generated/dependency lines and gcov version.
        Evidence: Focused Windows MinGW gcov report for changed production translation units.
    Validation:
      RequiredTargets: [BuildProbe, WorkflowController, WorkflowControllerContractTests]
      TargetedBuild:
        - cmake --preset windows-mingw -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage
        - cmake --build --preset windows-mingw --target BuildProbe WorkflowController WorkflowControllerContractTests
      ContractFixtures:
        - ctest --preset windows-mingw -R "^WorkflowController.Contract$" --output-on-failure
        - Run WorkflowController.exe process-level positive/negative resolution cases with a disposable copied shard and authorization commit S.
      StaticChecks:
