    Acceptance:
      - AcceptanceId: AC-1
        Description: >-
          V3 defines per-provider-request counters before retaining canonical events: at most 1,024 events including
          each nonterminal sink callback and the one returned terminal; at most 256 KiB of cumulative dynamic-string
          payload; at most 64 KiB combined accumulated text/refusal and safe generated text bytes; at most 64 KiB cumulative compact
          canonical JSON bytes for all complete ToolCallReady arguments; and at most 8 distinct pending tool calls,
          including started/incomplete and ready-but-not-dispatched calls. KiB means 1,024 bytes.
        Evidence: >-
          Fixed-head review verifies the exact per-request scope, inclusive event definition, aggregate-versus-per-call
          limits, overflow-safe counter arithmetic, and reset boundary at each new provider request.
      - AcceptanceId: AC-2
        Description: >-
          V3 defines dynamic-string accounting as UTF-8 payload octets measured by std::string::size(), summing every
          dynamically sized string field in canonical event metadata and payloads, including identifiers, text/refusal,
          safe generated text, reason/error codes, tool IDs/names/argument deltas, and recursively nested JSON string
          keys and values. Complete tool arguments are additionally counted by their compact canonical UTF-8 JSON
          serialization size; counters use stored byte lengths, not allocator capacity or Unicode normalization, and
          do not count unrelated provider wire buffers outside AgentRuntime-owned retained state.
        Evidence: >-
          Contract examples specify exact byte units and countable fields, state that checks happen before accumulator
          retention, and identify the single incoming event's already-materialized provider object as transient input
          outside the retained-state budget; provider wire-parser allocation limits remain a separate adapter concern.
      - AcceptanceId: AC-3
        Description: >-
          Crossing any limit latches one resource-limit stop before the offending payload is retained, requests stop on
          the runtime-owned stop_source forwarded to StreamTurnAsync, ignores later callbacks without accumulation,
          and awaits provider completion. No detached coroutine, blocking wait, partial tool dispatch, CoreActionReceipt,
          next provider request, or continuation is permitted after the limit latch.
        Evidence: >-
          The V3 stop/await state sequence is explicit for callback-time overflow and for a limit discovered when the
          returned terminal is received; borrowed inputs remain alive until the provider awaitable completes.
      - AcceptanceId: AC-4
        Description: >-
          If the provider settles definitively after a local limit latch, AgentRuntime discards the response and maps
          the request to Failed(OutputLimitReached), releasing per-request accumulation and turn budget state. A
          provider ResponseOutcomeUnknown or an escaped exception after dispatch may have started maps to
          UnknownOutcome, which has priority over resource-limit and caller-cancellation flags; unknown work is never
          retried, replayed, dispatched, or continued.
        Evidence: >-
          Contract decision table covers limit-before-terminal, terminal-after-limit, provider-unknown, and
          post-dispatch exception cases, including the exact precedence and no-replay result.
      - AcceptanceId: AC-5
        Description: >-
          V3 preserves all V2 turn bounds and semantics, including at most four dispatched tool cycles and eight
          dispatched calls per turn; the new eight-pending-call limit applies to a single provider request and cannot
          relax the existing per-turn cap. Existing V1 synchronous interfaces and AsyncModelProvider V1 are untouched.
        Evidence: >-
          The V3 contract declares itself an additive successor to V2 and explicitly states every retained V2 bound and
          the non-modification of provider/Core contracts.
      - AcceptanceId: AC-6
        Description: >-
          The implementation task changes exactly AsyncAgentRuntimeContractV3.md and marks V3 frozen only as the
          reviewed contract result. This registration PR changes only P3 task registration paths and contains no
          product implementation or assignment authorization. ED-0150 must receive a separate TaskRevision and
          post-merge AssignmentAccepted before any implementation of these limits.
        Evidence: >-
          Exact task Base-to-Head path comparison, fixed-head Worker04 review, TaskSpec state query, and final merged
          contract status; ED-0150 remains separately gated.
