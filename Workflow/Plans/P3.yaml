      - AcceptanceId: AC-2
        Description: >-
          The async runtime buffers ToolCallReady proposals and dispatches none until a single correlated ResponseCompleted(ToolHandoff) terminal passes request/turn/sequence and authoritative usage-budget checks; each ToolCallId is authorized and dispatched at most once.
        Evidence: >-
          FakeProvider event-order tests cover valid handoff, missing/duplicate terminal, foreign request or turn, invalid sequence, output-budget rejection, duplicate call ids, and non-handoff terminals; action handler invocation counts prove no premature or repeated dispatch.
      - AcceptanceId: AC-3
        Description: >-
          After definite read-only action results, Core creates correlated CoreActionReceipts containing ToolCallId, RequestId, AgentTurnId, action name, status, and sanitized code. Only these receipts may become matching tool-role results in the next canonical provider request; they are not ChannelReceipts, do not claim ChannelReceipt success, and cannot mark an OperationRecord successful. Each request uses a unique RequestId and the same AgentTurnId; at most four handoff cycles and eight tool calls are accepted before the loop terminates without dispatching more work.
        Evidence: >-
          An end-to-end co_spawn/io_context test proves Mock inbound -> Core identity/policy -> async FakeProvider ToolHandoff -> registered read-only Core action -> correlated CoreActionReceipt -> sanitized tool result -> second FakeProvider final answer -> exactly one final Mock Channel receipt. Tests assert matching ToolCallId/RequestId/AgentTurnId/action and prove CoreActionReceipt is not treated as a ChannelReceipt or OperationRecord success, plus cycle/call bound cases.
      - AcceptanceId: AC-4
        Description: >-
          Read-only handler failure/cancellation and Core rejection/unsupported are mapped without manufacturing an external receipt. R5 never dispatches an ExternalWrite/ExternalIo handler; such actions are rejected before invocation. Provider UnknownOutcome still stops the turn without provider continuation or replay.
        Evidence: >-
