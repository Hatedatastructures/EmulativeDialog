      WriteSetRationale:
        - "CoreChatService.h/.cpp are extended with additive ProcessAsync and a short StateMutex for Core-owned mutable containers; no parallel Core service or new .h header is introduced."
        - "CoreChatService already owns the existing CoreAuthorizedAction construction path and friendship, so CoreAuthorizedAction.h needs no change."
        - "ED-0114 is a required merged dependency before this task is assigned, serializing the overlapping CoreChatService.cpp ownership."
      CoreServiceApiChange: >-
        Add ProcessAsync to the existing CoreChatService.h returning boost::asio::awaitable<CoreChatResult>; accept the inbound
        message by value, AsyncAgentRuntimePort&, Providers::AsyncModelProviderPort&, and an optional std::stop_token. Reuse the
        existing instance Policy, ProviderProfile, ProviderLease, Channel, ChannelLease, ActionIdSource, RecordObserver, dedupe
        reservations, and issued-ID sets. Keep the existing constructor and synchronous Process signature unchanged.
        Preserve the existing early stop-token check. For every non-pre-cancelled call, Process and ProcessAsync must share this
        exact preflight order: Policy identity/route resolution -> scoped deduplication reservation under StateMutex -> inbound
        text extraction/empty/unsupported validation -> runtime/provider. Never validate text before reserving the key; an empty
        or unsupported message consumes it, so retry through either entrypoint returns Duplicate just as the current sync path does.
        Add std::mutex StateMutex to guard every access to CoreChatService-owned ProcessedDeduplicationIds, IssuedActionIds,
        IssuedOperationIds, IssuedIdempotencyKeys, and any OperationRecords vector access. The reservation remains consumed after
        the first attempt to preserve no-replay behavior. Each invocation owns its local OperationRecord in its stack/coroutine
        frame after the agent result; it is not shared between calls. Lock only for in-memory reservation, ID-set, and stored
        operation-record mutations. Release the mutex before Runtime/Provider calls, ActionIdSource::Next, observer callbacks,
        Channel.SendAction, and every co_await; observers receive a copied record snapshot after unlock.
        Add an API comment beside CoreActionIdSource::Next in this existing header: calls for distinct messages may overlap, so
        Next must be thread-safe and return globally unique action/operation/idempotency identifiers. RecordObserver and injected
        runtime/provider/channel ports must also support concurrent calls for distinct messages, or callers must otherwise satisfy
        their existing concurrency contracts. No executor or strand binding is claimed or required. The mutex never spans an
        awaitable suspension or external side effect.
