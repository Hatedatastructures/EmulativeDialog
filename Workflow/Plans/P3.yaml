          $Sources = @('Source/Agent/AsyncAgentRuntime.cpp', 'Source/Core/CoreChatService.cpp')
          if (-not (Test-Path -LiteralPath $CTestLog -PathType Leaf)) { throw "Missing fresh CTest log: $CTestLog" }
          $CTestText = [System.IO.File]::ReadAllText($CTestLog)
          $NormalizedCTestText = [System.Text.RegularExpressions.Regex]::Replace($CTestText, '\r\n?|\n', [string][char]10)
          $TestName = 'Agent.AsyncRuntimeVerticalSlice'
          $TestHeaderPattern = '(?m)^1/1 Testing: ' + [regex]::Escape($TestName) + '$'
          $TestHeaders = [System.Text.RegularExpressions.Regex]::Matches($NormalizedCTestText, $TestHeaderPattern)
          if ($TestHeaders.Count -ne 1) { throw "Expected exactly one CTest block for $TestName; found $($TestHeaders.Count)" }
          $HeaderIndex = $TestHeaders[0].Index
          $HeaderEnd = $HeaderIndex + $TestHeaders[0].Length
          $RemainingCTestText = $NormalizedCTestText.Substring($HeaderEnd)
          $NextTestHeader = [System.Text.RegularExpressions.Regex]::Match($RemainingCTestText, '(?m)^\d+/\d+ Testing: ')
          $TestBlockEnd = if ($NextTestHeader.Success) { $HeaderEnd + $NextTestHeader.Index } else { $NormalizedCTestText.Length }
          $TestBlock = $NormalizedCTestText.Substring($HeaderIndex, $TestBlockEnd - $HeaderIndex)
          $PassMarkers = [System.Text.RegularExpressions.Regex]::Matches($TestBlock, '(?m)^Test Passed\.$')
          if ($PassMarkers.Count -ne 1) { throw "The unique CTest block for $TestName does not contain exactly one Test Passed marker" }
          if ($CTestText -match '(?i)(libgcov|profiling error|checksum mismatch|overwrit|profile count data mismatch|cannot open notes file)') { throw 'CTest output contains a gcov checksum, overwrite, or profiling warning' }
          $TestInfo = Get-Item -LiteralPath $CTestLog
          $CoverageLog = Join-Path $Logs 'CoverageCommand.log'
          if (-not (Test-Path -LiteralPath $Report -PathType Container)) { throw "Missing report directory: $Report" }
          foreach ($RelativeSource in $Sources) {
            $Source = [System.IO.Path]::GetFullPath((Join-Path $Worktree $RelativeSource))
            $GcnoName = [System.IO.Path]::GetFileName($Source) + '.gcno'
            $GcnoMatches = @(Get-ChildItem -LiteralPath $Build -Recurse -File -Filter $GcnoName)
            if ($GcnoMatches.Count -ne 1) { throw "Expected exactly one notes file for $RelativeSource, found $($GcnoMatches.Count)" }
            $Gcno = $GcnoMatches[0]
            $Gcda = [System.IO.Path]::ChangeExtension($Gcno.FullName, '.gcda')
            if (-not (Test-Path -LiteralPath $Gcda -PathType Leaf)) { throw "Missing matching coverage data file: $Gcda" }
            $GcdaInfo = Get-Item -LiteralPath $Gcda
            if ($GcdaInfo.Length -le 0) { throw "Coverage data file is empty: $Gcda" }
            if ($TestInfo.LastWriteTimeUtc -lt $GcdaInfo.LastWriteTimeUtc) { throw "Required CTest record is older than its paired gcda file: $RelativeSource" }
            Push-Location $Report
            try {
              $GcovOutput = & $Gcov --json-format --branch-counts --preserve-paths -o $Gcno.FullName $Source 2>&1
              $GcovExit = $LASTEXITCODE
              $GcovText = $GcovOutput -join [Environment]::NewLine
              $GcovText | Add-Content -LiteralPath $CoverageLog
              if ($GcovExit -ne 0) { throw "gcov failed for $RelativeSource with exit $GcovExit" }
              if ($GcovText -match '(?im)^[ \t]*(?:gcov(?:\.exe)?[ \t]*:[ \t]*)?(?:warning|error):|libgcov|checksum|overwrit|cannot open notes file') { throw "gcov reported a warning or error for ${RelativeSource}: $GcovText" }
            } finally { Pop-Location }
          }
          $Backslash = [string][char]92
          foreach ($RelativeSource in $Sources) {
            $Source = [System.IO.Path]::GetFullPath((Join-Path $Worktree $RelativeSource))
            $Expected = $Source.Replace($Backslash, '/').ToLowerInvariant()
            $MatchesForSource = @()
            foreach ($JsonFile in @(Get-ChildItem -LiteralPath $Report -Filter '*.gcov.json.gz')) {
              $CoverageStream = [System.IO.File]::OpenRead($JsonFile.FullName)
              try {
                $Zip = [System.IO.Compression.GzipStream]::new($CoverageStream, [System.IO.Compression.CompressionMode]::Decompress)
                try {
                  $Reader = [System.IO.StreamReader]::new($Zip)
                  try { $Document = ConvertFrom-Json -InputObject $Reader.ReadToEnd() -ErrorAction Stop } finally { $Reader.Dispose() }
                } finally { $Zip.Dispose() }
              } finally { $CoverageStream.Dispose() }
              if ([string]$Document.format_version -notmatch '^2(?:\.0)?$') { throw "Unexpected gcov JSON format in $($JsonFile.FullName): $($Document.format_version)" }
              foreach ($File in $Document.files) {
                $Actual = ([System.IO.Path]::GetFullPath([string]$File.file)).Replace($Backslash, '/').ToLowerInvariant()
                if ($Actual -eq $Expected) { $MatchesForSource += [PSCustomObject]@{ JsonFile = $JsonFile.FullName; File = $File; Document = $Document } }
              }
            }
            if ($MatchesForSource.Count -ne 1) { throw "Expected exactly one gcov files[].file record for $RelativeSource, found $($MatchesForSource.Count)" }
            $UniqueLines = @($MatchesForSource[0].File.lines | Group-Object { [int]$_.line_number })
            $Total = $UniqueLines.Count
            $Covered = 0
            foreach ($LineGroup in $UniqueLines) { if (@($LineGroup.Group | Where-Object { [long]$_.count -gt 0 }).Count -gt 0) { $Covered++ } }
            if ($Total -eq 0 -or (100.0 * $Covered / $Total) -lt 80.0) { throw "Coverage below 80 percent for $RelativeSource ($Covered/$Total)" }
            Write-Output "SOURCE=$RelativeSource COVERED=$Covered TOTAL=$Total PERCENT=$([Math]::Round(100*$Covered/$Total,2)) FORMAT=$($MatchesForSource[0].Document.format_version) GCC=$($MatchesForSource[0].Document.gcc_version) REPORT=$($MatchesForSource[0].JsonFile)"
          }
