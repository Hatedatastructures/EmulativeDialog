      - {AcceptanceId: AC-5, Description: "Every unknown, expired, revoked, or destination-mismatched grant fails before ED-0146 guarded Stream invokes DoStream or either response sink.", Evidence: "The offline guarded-port fixture asserts Validate ordering/count and zero DoStream/head/chunk callback counters for each denied status; a valid grant validates once before DoStream."}
