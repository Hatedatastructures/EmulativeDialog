          $CompilerLine = [string]$CompilerLines[0]
          $FilePathCompilerPrefix = 'CMAKE_CXX_COMPILER:FILEPATH='
          $StringCompilerPrefix = 'CMAKE_CXX_COMPILER:STRING='
          if ($CompilerLine.StartsWith($FilePathCompilerPrefix, [System.StringComparison]::Ordinal)) {
            $CompilerValue = $CompilerLine.Substring($FilePathCompilerPrefix.Length)
          } elseif ($CompilerLine.StartsWith($StringCompilerPrefix, [System.StringComparison]::Ordinal)) {
            $CompilerValue = $CompilerLine.Substring($StringCompilerPrefix.Length)
          } else { throw 'CMAKE_CXX_COMPILER cache entry has an unsupported type' }
          if (-not [string]::Equals($CompilerValue, 'C:/msys64/ucrt64/bin/g++.exe', [System.StringComparison]::Ordinal)) { throw 'CMAKE_CXX_COMPILER does not match the frozen GCC path' }          $TestLog = Join-Path $Build 'Testing/Temporary/LastTest.log'
          if (-not (Test-Path -LiteralPath $TestLog -PathType Leaf)) { throw 'Missing CTest LastTest.log' }
          $TestLogInfo = Get-Item -LiteralPath $TestLog
          $TestLogLines = [System.IO.File]::ReadAllLines($TestLog)
          $TestLogText = $TestLogLines -join [Environment]::NewLine
          $TestName = 'Core.EndpointGrantAuthority'
          $TestStartPattern = '^\d+/\d+ Testing: ' + [regex]::Escape($TestName) + '\s*$'
          $TestStartIndexes = @()
          for ($Index = 0; $Index -lt $TestLogLines.Count; $Index++) {
            if ($TestLogLines[$Index] -match $TestStartPattern) { $TestStartIndexes += $Index }
          }
          if ($TestStartIndexes.Count -ne 1) { throw "Expected one LastTest.log block for $TestName; found $($TestStartIndexes.Count)" }
          $TestStartIndex = $TestStartIndexes[0]
          $TestEndIndex = $TestLogLines.Count
          for ($Index = $TestStartIndex + 1; $Index -lt $TestLogLines.Count; $Index++) {
            if ($TestLogLines[$Index] -match '^\d+/\d+ Testing: ' -or $TestLogLines[$Index] -match '^End testing:') {
              $TestEndIndex = $Index
