        - {AcceptanceId: AC-8, Description: "A short std::mutex StateMutex protects every read/write of CoreChatService per-instance dedupe reservations, issued-ID sets, and any stored OperationRecords; each invocation-local OperationRecord remains private to its sync call or coroutine frame. No mutex is held across co_await or external calls.", Evidence: "Fixed-head source review checks every shared-container access and lock scope. Multithreaded sync/async duplicate tests verify one reservation wins, the loser returns Duplicate, and at most one provider/runtime path and exactly one SendAction occur without executor/strand binding."}
        - {AcceptanceId: AC-9, Description: "Two different valid envelopes may enter sync Process and coroutine ProcessAsync concurrently on one CoreChatService instance; the API documents that CoreActionIdSource::Next is thread-safe and produces unique identifiers.", Evidence: "A barrier-start test uses an atomic thread-safe ID source, a synchronized RecordObserver, and a thread-safe MockChannelAdapter fixture. Assert two completed results, distinct ActionId/OperationId/IdempotencyKey triples, and exact per-message correlation among observed OperationRecords, SendAction arguments, and scripted ChannelReceipts with no lost or cross-matched receipt."}
