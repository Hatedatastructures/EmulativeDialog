        - {AcceptanceId: AC-5, Description: "AsyncAgentRuntime preserves V1 request/event correlation and terminal mapping under the new Async contracts; the existing synchronous Process signature and V1 ports remain source-compatible, with no synchronous wait, std::future::get, thread-per-request, or real transport.", Evidence: "The same standalone target exercises both sync and async entries, and static review confirms the V1 declaration and behavior remain compatible."}
        - {AcceptanceId: AC-6, Description: "Each changed production source AsyncAgentRuntime.cpp and CoreChatService.cpp achieves at least 80 percent unique executable-line coverage.", Evidence: "A fresh Windows gcov JSON v2 report for each exact source is tied to its unique .gcno/.gcda pair and the passing CTest record; the command reports unique executable line numerator/denominator and fails below 80 percent."}
