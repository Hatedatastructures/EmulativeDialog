      ForbiddenSet and exceeded the 12-file default without a reason. Worker01 and Worker05 also found
      that R1's gcov steps generated reports without enforcing the required 80% threshold. The Windows
      MinGW toolchain has BCrypt headers/import library; this revision freezes the secure-token semantics
      and test boundary before implementation.
