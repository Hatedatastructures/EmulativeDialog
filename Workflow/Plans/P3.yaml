      Decision: Accepted
      ApprovedByRole: Coordinator
      Scope: "If ProposalId is absent, write EDMemoryV1/<Category>/<0|1>. A present ProposalId must be non-empty and is written as EDMemoryV2/<Category>/<0|1>/P<byte-length>:<lowercase hex of exact ProposalId bytes>, where byte-length is the exact std::string byte count. Decode V1 as absent and V2 as present; require canonical decimal length, reject arithmetic overflow before multiplication/allocation, require exactly 2*byte-length lowercase hex digits and no trailing bytes, validate category and bit, and fail closed on an empty ID or malformed/unknown/future versions. Preserve all non-empty ProposalId bytes exactly, including embedded NUL. Require the full encoded MemoryKind to fit INT_MAX bytes on write and read, matching SqliteStore::BindText's int length."
      Evidence: "SQLite real-file tests prove V1 compatibility without inventing a missing ProposalId and exact V2 ProposalId round trips through ApplyAtomically/ListActive/RecallBackup, close/reopen, ConversationMemory Recall and RestoreBackup, including delimiter, embedded-NUL and non-UTF-8 bytes; empty and mismatched proposal-bound IDs fail closed. Malformed, truncated, overflow, invalid-hex, trailing, over-limit, unknown V3 and future encodings fail closed on active and backup reads."
