    Scope: >-
      Preserve the current four-path Memory adapter WriteSet, physical SQLite schema, dependencies, contracts, owner and
      reviewer. In RecallBackup, use SqliteStore::ListActiveRecords and the existing full MemoryRecord conversion so
      ExpiresAt survives; fixed-head review independently confirmed its scope validation, active/tombstone predicate,
