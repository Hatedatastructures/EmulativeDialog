          if ($ExitCode -ne 0) { throw "gcov failed with exit ${ExitCode}: $OutputText" }
          if ($OutputText -match $WarningPattern) { throw "gcov reported stale/conflicting coverage data: $OutputText" }

          $JsonFiles = @(Get-ChildItem -LiteralPath $RunRoot -File -Filter '*.gcov.json.gz')
          if ($JsonFiles.Count -ne 1) { throw "Expected one gcov JSON report; found $($JsonFiles.Count)" }
          $Json = Read-GcovJson $JsonFiles[0].FullName
