        - {AcceptanceId: AC-2, Description: "CoreChatService::Process and ProcessAsync use one shared preflight in the frozen order identity/route -> dedupe reservation -> text/input validation -> runtime/provider; the existing pre-cancel check remains unchanged.", Evidence: "Assert unknown identity/route exits before reservation or async calls. Unsupported and empty sync input each consumes its key; a repeated same envelope through ProcessAsync returns Duplicate without async calls. Repeat with async invalid input followed by sync duplicate. Barrier-start mixed sync/async valid duplicates on separate worker threads hold the winner at a fake-runtime gate; exercise both winner orders and assert one reservation, one non-Duplicate result, at most one runtime/provider path, and one SendAction."}
