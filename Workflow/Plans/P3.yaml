      Scope: >-
        Replace the validation-only R4 task as the current ED-0150 revision with an implementation task; freeze additive AsyncAgentRuntimeContract V2, AsyncBusinessActionContract V1 and CoreAgentContract V1.1. Limit registered handlers to EffectClass::InProcessReadOnly and make registry rejection of ExternalWrite/ExternalIo enforceable before advertising or invocation. Add CoreActionReceipt as the definite result for these read-only actions; do not use it as a ChannelReceipt or OperationRecord success. External-write handlers are deferred to a separate OperationRecord/ChannelReceipt-backed task. Preserve the full R4 record under PreviousRevision4. No provider wire protocol, real channel, or non-chat tool is added.
