      Reviewer verified ListActiveRecords and RecallBackupForScope use identical SQL scope, active-state, expiration,
      and ordering predicates; the former hydrates the complete MemoryRecord and preserves expiry without changing the
      Storage API or writing Storage-owned paths.
    Impact: "Adapter behavior and its existing real SQLite contract tests change; on-disk schema, encoded ProposalId format, consent policy, and Storage API remain unchanged."
    Rollback: "If the R3 expiry regression cannot pass, keep PR #25 open and revert only the unmerged adapter/test changes; no schema migration or persisted-data rewrite is performed."
