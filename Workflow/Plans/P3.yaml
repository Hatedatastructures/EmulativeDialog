        $Gxx = 'C:/msys64/ucrt64/bin/g++.exe'
        $Gcov = 'C:/msys64/ucrt64/bin/gcov.exe'
        $ExpectedVersion = '16.1.0'
        $WarningPattern = '(?im)(?:libgcov|profiling)[^\r\n]*(?:checksum|overwrit\w*)|(?:checksum|overwrit\w*)[^\r\n]*(?:libgcov|profiling)'

        function Normalize-Path([string]$Path, [string]$BaseDirectory) {
          $Value = $Path.Replace('/', '\')
          if (-not [System.IO.Path]::IsPathRooted($Value)) { $Value = Join-Path $BaseDirectory $Value }
          return [System.IO.Path]::GetFullPath($Value).TrimEnd('\').ToLowerInvariant()
        }
        function Read-GcovJson([string]$Path) {
          $InputStream = [System.IO.File]::OpenRead($Path)
          try {
            $ZipStream = [System.IO.Compression.GzipStream]::new($InputStream, [System.IO.Compression.CompressionMode]::Decompress)
            try {
              $Reader = [System.IO.StreamReader]::new($ZipStream)
              try { $JsonText = $Reader.ReadToEnd() } finally { $Reader.Dispose() }
            } finally { $ZipStream.Dispose() }
          } finally { $InputStream.Dispose() }
          return (ConvertFrom-Json -InputObject $JsonText -ErrorAction Stop)
        }

        try {
          if (-not (Test-Path -LiteralPath $Build -PathType Container)) { throw "Missing task build directory: $Build" }
          $Cache = Join-Path $Build 'CMakeCache.txt'
          if (-not (Test-Path -LiteralPath $Cache -PathType Leaf)) { throw 'Missing fresh CMakeCache.txt' }
          $CacheText = [System.IO.File]::ReadAllText($Cache).Replace(([string][char]13 + [string][char]10), [string][char]10).Replace([string][char]13, [string][char]10)
          if ($CacheText -notmatch '(?m)^CMAKE_PROJECT_NAME:STATIC=EmulativeDialogConversationMemoryContract$') { throw 'Wrong CMake project in task build directory' }
          if ($CacheText -notmatch '(?m)^CMAKE_HOME_DIRECTORY:INTERNAL=H:/Qbot/EmulativeDialog\.ED-0148/Tests/Contract/Memory$') { throw 'CMake source directory does not match ED-0148' }
          if ($CacheText -notmatch '(?mi)^CMAKE_CXX_COMPILER:(?:FILEPATH|STRING)=C:/msys64/ucrt64/bin/g\+\+\.exe$') { throw 'CMAKE_CXX_COMPILER does not match the frozen GCC path' }
          if ($CacheText -notmatch '(?m)^CMAKE_CXX_FLAGS:STRING=.*--coverage') { throw 'CMAKE_CXX_FLAGS is missing --coverage' }
          if ($CacheText -notmatch '(?m)^CMAKE_EXE_LINKER_FLAGS:STRING=.*--coverage') { throw 'CMAKE_EXE_LINKER_FLAGS is missing --coverage' }

          $CompilerText = (& $Gxx --version 2>&1 | Out-String)
          $VersionPattern = "(?<![0-9.])$([regex]::Escape($ExpectedVersion))(?![0-9.])"
          if ($LASTEXITCODE -ne 0 -or $CompilerText -notmatch $VersionPattern) { throw "Expected GCC $ExpectedVersion; $CompilerText" }
          $GcovText = (& $Gcov --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $GcovText -notmatch $VersionPattern -or $GcovText -notmatch 'JSON format version:\s*2') { throw "Expected gcov $ExpectedVersion with JSON v2; $GcovText" }

          $OldJson = @(Get-ChildItem -LiteralPath $Build -Recurse -File -Filter '*.gcov.json.gz')
          if ($OldJson.Count -ne 0) { throw 'Task build must be fresh; gcov JSON already exists' }
          $Notes = @(Get-ChildItem -LiteralPath $Build -Recurse -File -Filter 'ConversationMemory.cpp.gcno')
          if ($Notes.Count -ne 1) { throw "Expected one ConversationMemory.cpp.gcno; found $($Notes.Count)" }
          $Data = [System.IO.Path]::ChangeExtension($Notes[0].FullName, '.gcda')
          if (-not (Test-Path -LiteralPath $Data -PathType Leaf)) { throw "Missing paired coverage data: $Data" }
          if ((Get-Item -LiteralPath $Data).LastWriteTimeUtc -lt (Get-Item -LiteralPath $Notes[0].FullName).LastWriteTimeUtc) { throw 'gcda predates gcno; rebuild and rerun CTest' }
          $TestLog = Join-Path $Build 'Testing/Temporary/LastTest.log'
          if (-not (Test-Path -LiteralPath $TestLog -PathType Leaf)) { throw 'Missing CTest LastTest.log' }
          $TestLogText = [System.IO.File]::ReadAllText($TestLog)
          if ($TestLogText -notmatch 'ConversationMemoryTests' -or $TestLogText -notmatch '(?im)Test Passed\.') { throw 'LastTest.log does not prove ConversationMemoryTests passed' }
          if ($TestLogText -match $WarningPattern) { throw 'CTest log contains a libgcov checksum/overwrite warning' }
          if ((Get-Item -LiteralPath $TestLog).LastWriteTimeUtc -lt (Get-Item -LiteralPath $Data).LastWriteTimeUtc) { throw 'CTest log predates gcda execution data' }

          New-Item -ItemType Directory -Force -Path $Reports | Out-Null
          $RunRoot = Join-Path $Reports ('Run-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $RunRoot | Out-Null
          Push-Location -LiteralPath $RunRoot
          try { $Output = @(& $Gcov --json-format --branch-counts --preserve-paths -o $Notes[0].FullName $Source 2>&1); $ExitCode = $LASTEXITCODE }
          finally { Pop-Location }
          $OutputText = ($Output | ForEach-Object { [string]$_ }) -join "`n"
          if ($ExitCode -ne 0) { throw "gcov failed with exit ${ExitCode}: $OutputText" }
          if ($OutputText -match $WarningPattern) { throw "gcov reported stale/conflicting data: $OutputText" }

          $JsonFiles = @(Get-ChildItem -LiteralPath $RunRoot -File -Filter '*.gcov.json.gz')
          if ($JsonFiles.Count -ne 1) { throw "Expected one gcov JSON report; found $($JsonFiles.Count)" }
          $Json = Read-GcovJson $JsonFiles[0].FullName
          if ([string]$Json.format_version -ne '2' -or [string]$Json.gcc_version -ne $ExpectedVersion) { throw 'Wrong gcov JSON format/GCC version' }
          $ExpectedSource = Normalize-Path $Source $Worktree
          $SourceRecords = @($Json.files | Where-Object { (Normalize-Path ([string]$_.file) ([string]$Json.current_working_directory)) -eq $ExpectedSource })
          if ($SourceRecords.Count -ne 1) { throw "Expected one ConversationMemory.cpp files[] record; found $($SourceRecords.Count)" }

          $LineCoverage = @{}
          foreach ($Line in @($SourceRecords[0].lines)) {
            if ($null -eq $Line.line_number -or $null -eq $Line.count) { throw 'Missing line_number/count in gcov JSON' }
            $Number = [int]$Line.line_number; $Count = [long]$Line.count
            if ($Number -le 0 -or $Count -lt 0) { throw 'Invalid executable line record' }
            if (-not $LineCoverage.ContainsKey($Number)) { $LineCoverage[$Number] = $false }
            if ($Count -gt 0) { $LineCoverage[$Number] = $true }
          }
          $Total = $LineCoverage.Count
          if ($Total -eq 0) { throw 'Executable-line denominator is empty' }
          $Covered = 0
          foreach ($Hit in $LineCoverage.Values) { if ($Hit) { $Covered++ } }
          $Percent = 100.0 * $Covered / $Total
          $PercentText = $Percent.ToString('F2', [System.Globalization.CultureInfo]::InvariantCulture)
          Write-Output "ConversationMemory.cpp COVERED=$Covered EXECUTABLE=$Total PERCENT=$PercentText GCC=$($Json.gcc_version) GCOV=$ExpectedVersion JSON=2 REPORT=$($JsonFiles[0].FullName)"
          if (($Covered * 100) -lt ($Total * 80)) { throw "ConversationMemory.cpp coverage $PercentText% is below 80%" }
