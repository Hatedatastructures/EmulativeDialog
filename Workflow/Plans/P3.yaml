  - ChangeRequestId: CR-ED-0144-R2-DATA-001
    RequestedBy: MemoryOwner
    RequestedByAgentId: /root/worker05_ed0144_memory
    ApprovedBy: Coordinator
    ApprovedByAgentId: /root
    Decision: Accepted
    TaskIds: [ED-0144]
    TaskRevisionTransitions:
      - {TaskId: ED-0144, FromRevision: 1, ToRevision: 2}
    Scope: >-
      Preserve the existing physical SqliteStore schema and four-path WriteSet. Keep EDMemoryV1/<Category>/<0|1>
      for records whose optional ProposalId is absent. Encode present ProposalId values in
      EDMemoryV2/<Category>/<0|1>/P<byte-length>:<lowercase hex of exact ProposalId bytes>, counting the exact
      std::string byte sequence; decode V1 and V2; reject an empty present ProposalId, noncanonical/malformed lengths,
      overflow, truncation, invalid hex, trailing bytes, unknown/future
      versions and invalid categories fail-closed. Extend the existing SQLite contract tests to prove exact
      proposal-bound ID preservation through write/list/recall, close/reopen, backup recall and authorized restore;
      a different ProposalId must not match the proposal-bound consent.
    Reason: >-
      Fixed-head Major ED-0144-R1-F001 demonstrates that dropping StoredMemory.ProposalId makes an authorized
      proposal-bound record fail ConsentMatches after SQLite recall and backup restore. SqliteStore records have no
      ProposalId field and the physical schema is frozen, so the reversible encoding stores the exact value in the
      existing MemoryKind text field while preserving V1 for records without an ID. Hex encoding keeps persisted
      text NUL-free and preserves arbitrary ProposalId bytes through SqliteStore text reads. Bound the complete
      encoded MemoryKind to INT_MAX bytes because SqliteStore::BindText narrows its length to int; enforce the same
      limit on write and read and reject before multiplication or allocation.
    PreserveTaskIdDependenciesOwnerReviewerModuleBoundaryAndPhysicalSchema: true
    PreserveV1Compatibility: true
    AcceptedAt: 2026-10-28

