# 稳定工作槽注册表，不代表当前已经启动了这些 Agent。
SchemaVersion: 1
MaximumSubagents: 8
State: Planned
EffectiveParallelism:
  Formula: MinimumOfConfiguredSlotsHostCapacityAndReadyIndependentTasks

LifecyclePolicy:
  KeepLogicalSlotIdentityAcrossTasks: true
  ReuseAgentForRelatedTasks: true
  DoNotCreateOrCloseAnAgentForEverySmallTask: true
  UseTaskCheckpointInsteadOfCarryingUnrelatedConversation: true
  IfHostCannotKeepSession:
    PreserveLogicalSlot: true
    RestoreFromCheckpoint: true
    NeverClaimOldSessionIsStillRunning: true
  RetireOnlyWhen:
    - ResponsibilityIsRemovedOrReassignedByApprovedDecision
    - AgentCannotSatisfyRequiredQualityOrSecurityBoundary
    - HostSessionIsUnavailableAndRecoveryWasAttempted
    - UserOrCoordinatorExplicitlyClosesTheSlot

Slots:
  - SlotId: Worker01
    RoleFamily: BuildAndWorkflowOwner
    AgentId: "/root/workflow_controller"
    HostSessionRef: ""
    ModuleIds:
      - RootBuildAndDependencies
      - AgentWorkflowController
    CurrentTaskId: ED-0008
    Status: Active
  - SlotId: Worker02
    RoleFamily: AgentRuntimeOwner
    AgentId: "/root/agent_core"
    HostSessionRef: ""
    ModuleIds:
      - AgentRuntime
      - Core
    CurrentTaskId: ED-0007
    Status: Review
  - SlotId: Worker03
    RoleFamily: ResponsesProviderOwner
    AgentId: "/root/provider_responses"
    HostSessionRef: ""
    ModuleIds:
      - ProviderOpenAIResponses
    CurrentTaskId: ""
    Status: Dormant
  - SlotId: Worker04
    RoleFamily: ChatCompletionsProviderOwner
    AgentId: "/root/provider_chat"
    HostSessionRef: ""
    ModuleIds:
      - ProviderOpenAIChatCompletions
    CurrentTaskId: ""
    Status: Dormant
  - SlotId: Worker05
    RoleFamily: AnthropicProviderOwner
    AgentId: "/root/provider_anthropic"
    HostSessionRef: ""
    ModuleIds:
      - ProviderAnthropicMessages
    CurrentTaskId: ""
    Status: Dormant
  - SlotId: Worker06
    RoleFamily: MemoryContextOwner
    AgentId: "/root/memory_context"
    HostSessionRef: ""
    ModuleIds:
      - Memory
      - ContextSelector
    CurrentTaskId: ""
    Status: Dormant
  - SlotId: Worker07
    RoleFamily: Unassigned
    AgentId: ""
    HostSessionRef: ""
    ModuleIds: []
    CurrentTaskId: ""
    Status: Dormant
  - SlotId: Worker08
    RoleFamily: Unassigned
    AgentId: ""
    HostSessionRef: ""
    ModuleIds: []
    CurrentTaskId: ""
    Status: Dormant

AssignmentRules:
  - 每个活动任务必须且只能属于一个 OwnerSlotId。
  - 一个 Slot 同时最多负责一个有写权限的 Active task。
  - Reviewer 可以复用空闲槽，但不得审查自己编写的 PR。
  - 不能用重复分析、无写集工作或低价值任务填满空闲槽。
  - 每次分派/回收/恢复都追加 AgentSlotAssigned、AgentSlotRecovered 或 AgentSlotRetired 事件。
