# 稳定工作槽注册表，不代表当前已经启动了这些 Agent。
SchemaVersion: 1
MaximumSubagents: 6
MaximumRemoteBranches: 4
ReservedIntegrationBranches: 1
MaximumConcurrentTaskBranches: 3
RemoteBranchCapCountsDefaultBranch: true
RetireRemoteTaskBranchAfterMerge: true
State: Active
SlotClasses:
  SupportSlots: [Worker01, Worker06]
  ImplementationSlots: [Worker02, Worker03, Worker04, Worker05]
EffectiveParallelism:
  Formula: MinimumOfConfiguredSlotsHostCapacityReadyIndependentTasksAndRemoteBranchCapacity

LifecyclePolicy:
  KeepLogicalSlotIdentityAcrossTasks: true
  ReuseAgentForRelatedTasks: true
  DoNotCreateOrCloseAnAgentForEverySmallTask: true
  UseTaskCheckpointInsteadOfCarryingUnrelatedConversation: true
  IfHostCannotKeepSession:
    PreserveLogicalSlot: true
    RestoreFromCheckpoint: true
    NeverClaimOldSessionIsStillRunning: true
  RetireOnlyWhen:
    - ResponsibilityIsRemovedOrReassignedByApprovedDecision
    - AgentCannotSatisfyRequiredQualityOrSecurityBoundary
    - HostSessionIsUnavailableAndRecoveryWasAttempted
    - UserOrCoordinatorExplicitlyClosesTheSlot

Slots:
  # Existing AgentIds remain the stable identities. A replacement binding must
  # be recorded as an explicit, auditable slot migration rather than silently
  # rewriting the registry.
  - SlotId: Worker01
    RoleFamily: BuildAndWorkflowOwner
    AgentId: "/root/p1_trace_events_luna"
    ModelRequest: InheritCoordinator
    ReasoningEffort: InheritCoordinator
    HostSessionRef: "/root/worker01_ed0105_owner"
    ModuleIds:
      - RootBuildAndDependencies
      - AgentWorkflowController
    CurrentTaskId: ED-0146/R6-AssignmentLedgerReview
    Status: Assigned
  - SlotId: Worker02
    RoleFamily: AgentRuntimeOwner
    AgentId: "/root/p1_code001_luna"
    ModelRequest: InheritCoordinator
    ReasoningEffort: InheritCoordinator
    HostSessionRef: "/root/worker02_ed0114_owner"
    ModuleIds:
      - AgentRuntime
      - Core
      - ChannelAdapterPort
    CurrentTaskId: ED-0112/R5-TurnRecovery
    Status: Assigned
  - SlotId: Worker03
    RoleFamily: ResponsesProviderOwner
    AgentId: "/root/p1_gov004_luna"
    ModelRequest: InheritCoordinator
    ReasoningEffort: InheritCoordinator
    HostSessionRef: "/root/worker03_ed0114_validation"
    ModuleIds:
      - ProviderOpenAIResponses
    CurrentTaskId: ED-0146/R6-HttpTransportGrantGuard
    Status: Assigned
  - SlotId: Worker04
    RoleFamily: ChatCompletionsProviderOwner
    AgentId: "/root/p2_validation_luna"
    ModelRequest: InheritCoordinator
    ReasoningEffort: InheritCoordinator
    HostSessionRef: "/root/worker04_ed0114_review"
    ModuleIds:
      - ProviderOpenAIChatCompletions
    CurrentTaskId: ED-0112/R5-AssignmentLedgerReview
    Status: Assigned
  - SlotId: Worker05
    RoleFamily: AnthropicProviderAndMemoryOwner
    AgentId: "/root/p3_validation_luna"
    ModelRequest: InheritCoordinator
    ReasoningEffort: InheritCoordinator
    HostSessionRef: "/root/worker05_ed0144_memory"
    ModuleIds:
      - ProviderAnthropicMessages
      - Memory
      - ContextSelector
    CurrentTaskId: ""
    Status: Active
  - SlotId: Worker06
    RoleFamily: IntegrationAndValidationSupport
    AgentId: "/root/p1_par001_luna"
    ModelRequest: InheritCoordinator
    ReasoningEffort: InheritCoordinator
    HostSessionRef: "/root/worker06_ed0105_review"
    ModuleIds: []
    CurrentTaskId: ""
    Status: Active

AssignmentRules:
  - 每个活动任务必须且只能属于一个 OwnerSlotId。
  - 一个 Slot 同时最多负责一个有写权限的 Active task。
  - Reviewer 可以复用空闲槽，但不得审查自己编写的 PR。
  - 不能用重复分析、无写集工作或低价值任务填满空闲槽。
  - 每次分派/回收/恢复都追加 AgentSlotAssigned、AgentSlotRecovered 或 AgentSlotRetired 事件。

TaskScopedModuleAuthorizations:
  - ChangeRequestId: CR-ED-0112-006
    TaskId: ED-0112
    TaskRevision: 5
    SlotId: Worker02
    AgentId: /root/worker02_ed0114_owner
    ModuleId: Storage
    State: Active
    EffectiveOnlyAfter: [OwnerApproval, IndependentReviewerApproval, ChangeRequestApproval, MainMerge]
    AllowedPaths:
      - Source/Storage/TurnCheckpointStore.hpp
      - Source/Storage/TurnCheckpointStore.cpp
      - Tests/Contract/Storage/TurnCheckpointStoreTests.cpp
    Restrictions:
      - NoStorageModuleAuthorizationOutsideED0112R5
      - PreserveStorageSchemaLock
      - PreserveEightPathTaskWriteSet
  - ChangeRequestId: CR-ED-0120-006
    TaskId: ED-0146
    TaskRevision: 6
    SlotId: Worker03
    AgentId: /root/worker03_ed0114_validation
    ModuleId: NetworkPlatform
    State: Active
    EffectiveOnlyAfter: [OwnerApproval, IndependentReviewerApproval, ChangeRequestApproval, MainMerge]
    AllowedPaths:
      - Architecture/Contracts/HttpTransportContract.md
      - Source/Platform/Network/HttpTransportPort.hpp
      - Source/Platform/Network/WinHttpTransport.hpp
      - Source/Platform/Network/WinHttpTransport.cpp
