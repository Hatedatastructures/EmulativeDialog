  - ChangeRequestId: CR-ED-0120-006
    TaskId: ED-0146
    TaskRevision: 6
    SlotId: Worker03
    AgentId: /root/worker03_ed0114_validation
    ModuleId: ProviderOpenAIResponses
    State: Active
    EffectiveOnlyAfter: [OwnerApproval, IndependentReviewerApproval, ChangeRequestApproval, MainMerge]
    AllowedPaths:
      - Tests/Contract/Providers/OpenAIResponses/OpenAIResponsesProviderTests.cpp
  - ChangeRequestId: CR-ED-0120-006
