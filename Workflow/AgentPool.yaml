      - Tests/Contract/Platform/Network/HttpTransportPortTests.cpp
      - Tests/Contract/Platform/Network/WinHttpTransportTests.cpp
    Restrictions:
      - NoRootBuildOrDependencyPinChanges
      - NoProviderProductionWireBehaviorChanges
