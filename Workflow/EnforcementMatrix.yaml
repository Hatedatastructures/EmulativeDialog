    IndependentReviewerMustDifferFromAuthor: true
    CoordinatorSignoffAuthorityRole: Coordinator
    CoordinatorMustNotBeTaskAuthor: true
    CoordinatorSignoffMustBeDifferentFromReviewer: true
    CoordinatorSignoffRequiredAfterIndependentReview: true
    RuleOwnerMayProvideEvidenceButCannotSelfApprove: true
    UnresolvedBlockerKeepsGateOpen: true
    EvidenceMustReference:
      - ReleaseId
      - PhaseId
      - TaskId
      - TaskRevision
      - BaseCommit
      - HeadCommit
      - SourceCommit
      - RuleId
