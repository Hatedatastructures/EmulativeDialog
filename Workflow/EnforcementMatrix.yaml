        PassCondition: "实际 Goal/Acceptance/WriteSet 与固定版本一致；任何范围变化都有获批的新 Revision。"
        RequiredEvidence: ["固定 TaskSpec commit/blob", "TaskRevision 与 ChangeRequest 事件链接", "Finding/变更处置"]
