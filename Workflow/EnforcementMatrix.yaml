      - RuleId: CODE-002
        P1StageStatus: PendingCoordinatorEvaluation
        FutureGateStatus: Planned
        BlockerIds: [P1-CPP20-Windows-Build]
        OwnerRole: BuildAndDependencyOwner
        Control: "核实产品逻辑与随包可执行模块使用 C++，且依赖均已批准。"
        PassCondition: "所有目标均以原生 C++ 构建，发行目标和依赖清单符合已批准范围。"
        RequiredEvidence: ["Windows C++20 configure/build 输出", "目标与发行包清单", "依赖策略"]
        EvidenceStatus: Pending
