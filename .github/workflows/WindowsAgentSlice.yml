name: WindowsAgentSlice

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "Task/**"
permissions:
  contents: read

jobs:
  build-and-test:
    name: WindowsAgentSlice / Build and Test
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up UCRT64 MinGW
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          location: 'C:\msys64'
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Verify Windows C++20 toolchain
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $compiler = (Get-Command g++ -ErrorAction Stop).Source
          $expectedCompiler = 'C:\msys64\ucrt64\bin\g++.exe'
          if ([System.IO.Path]::GetFullPath($compiler) -ne $expectedCompiler) {
            throw "Unexpected C++ compiler: $compiler"
          }
          g++ --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $make = 'C:\msys64\ucrt64\bin\mingw32-make.exe'
          if (-not (Test-Path -LiteralPath $make -PathType Leaf)) {
            throw "Preset make program is missing: $make"
          }
          & $make --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows agent slice
        run: |
          $dependencyCache = Join-Path $env:RUNNER_TEMP 'EmulativeDialog\Dependencies'
          cmake --preset windows-agent-slice "-DFETCHCONTENT_BASE_DIR=$dependencyCache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows agent slice
        run: |
          cmake --build --preset windows-agent-slice --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows agent slice tests
        run: |
          ctest --preset windows-agent-slice --no-tests=error --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
